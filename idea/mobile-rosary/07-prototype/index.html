:root{
  --night:#141210;
  --night-deep:#0C0B09;
  --smoke:#211D18;
  --smoke-line:#332D25;
  --vellum:#E9E2D4;
  --ash:#9C9283;
  --ash-dim:#6E6558;
  --candle:#D9A05B;
  --candle-soft:rgba(217,160,91,.14);
  --candle-line:rgba(217,160,91,.38);
  --serif:"MyRosary Serif","Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","Apple Myungjo",Batang,Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#080706;
  font-family:var(--serif);
  color:var(--vellum);
  -webkit-font-smoothing:antialiased;
}

/* ---- 폰 프레임: 데스크톱에서는 390x844 중앙, 모바일에서는 전체 화면 ---- */
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px}
#phone{
  position:relative;width:390px;height:844px;flex:0 0 auto;
  background:var(--night);border-radius:44px;overflow:hidden;
  border:1px solid #2A2620;
  box-shadow:0 0 0 9px #131110,0 0 0 10px #2c2721,0 40px 90px rgba(0,0,0,.75);
}
@media (max-width:520px),(max-height:900px) and (pointer:coarse){
  #stage{padding:0}
  #phone{width:100%;height:100dvh;border-radius:0;border:0;box-shadow:none}
}

/* ---- 뷰 전환 ---- */
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--night)}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}

/* ---- 공통 타이포 ---- */
.micro{font-size:12px;letter-spacing:.14em;color:var(--ash);font-weight:400}
.micro b{color:var(--candle);font-weight:600}
h1,h2,h3{font-weight:600}
button{font-family:var(--serif);color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--candle);outline-offset:2px}

/* ==========================================================================
   홈
   ========================================================================== */
#view-home .scroll{padding:56px 22px 34px}
.home-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px}
.wordmark{font-size:15px;letter-spacing:.30em;color:var(--vellum);font-weight:600}
.wordmark span{color:var(--candle)}
#home-date{font-size:12.5px;color:var(--ash);letter-spacing:.06em}

/* 이어서 바치기 — 홈의 유일한 강조 */
.resume-card{
  display:block;width:100%;text-align:left;
  background:linear-gradient(160deg,rgba(217,160,91,.10),rgba(217,160,91,.03) 55%,transparent);
  border:1px solid var(--candle-line);border-radius:20px;
  padding:22px 22px 20px;position:relative;overflow:hidden;
}
.resume-card:active{transform:scale(.985)}
.resume-card .micro{display:block;margin-bottom:12px}
.resume-title{display:block;font-size:26px;line-height:1.3;font-weight:600;color:var(--vellum);padding-right:56px}
.resume-sub{display:block;font-size:17px;color:var(--candle);margin-top:6px;font-weight:600;padding-right:56px}
.resume-meta{display:block;font-size:12.5px;color:var(--ash);margin-top:14px;letter-spacing:.04em;padding-right:56px}
.resume-go{
  position:absolute;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--candle-line);display:flex;align-items:center;justify-content:center;
  color:var(--candle);font-size:18px;background:var(--candle-soft);
}
.resume-card.done{border-color:var(--smoke-line);background:var(--smoke)}
.resume-card.done .resume-sub{color:var(--ash)}
.resume-card.done .resume-go{display:none}

/* 조용한 카드들 */
.quiet-card{
  background:var(--smoke);border:1px solid var(--smoke-line);border-radius:20px;
  padding:18px 22px;margin-top:14px;width:100%;text-align:left;display:block;
}
.quiet-card .micro{display:block;margin-bottom:9px}
.today-name{font-size:18px;font-weight:600}
.today-desc{font-size:13.5px;color:var(--ash);line-height:1.7;margin-top:5px}

.novena-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.novena-title{font-size:18px;font-weight:600}
.novena-count{font-size:14px;color:var(--candle);white-space:nowrap;font-weight:600}
.novena-intent{font-size:13.5px;color:var(--ash);margin-top:5px}
.dotrow{display:flex;gap:7px;margin-top:14px}
.dotrow i{width:9px;height:9px;border-radius:50%;background:#3A342B;display:block}
.dotrow i.d{background:var(--candle)}
.dotrow i.t{background:transparent;border:1.5px solid var(--candle)}
.quiet-card:active{transform:scale(.99)}

.newstart{
  margin-top:22px;width:100%;padding:16px;border-radius:16px;
  border:1px solid var(--smoke-line);color:var(--ash);font-size:15.5px;letter-spacing:.08em;
}
.newstart:active{background:var(--smoke)}

/* ==========================================================================
   기도 화면
   ========================================================================== */
#view-pray{background:radial-gradient(120% 55% at 50% 108%,#241D13 0%,var(--night) 55%)}
.pray-head{padding:50px 26px 0;text-align:center}
.pray-where{font-size:12px;letter-spacing:.22em;color:var(--candle);font-weight:600}
.pray-mystery{font-size:19px;font-weight:600;margin-top:9px;line-height:1.45}
.pray-medit{font-size:13.5px;color:var(--ash);line-height:1.75;margin-top:7px;max-width:310px;margin-left:auto;margin-right:auto;transition:opacity .25s}
.medit-toggle{display:block;margin:6px auto 0;color:var(--ash-dim);font-size:11px;letter-spacing:.18em;padding:4px 10px}
.pray-head.folded .pray-medit{display:none}

/* 묵주 스트랜드 (시그니처) */
.strand{height:74px;display:flex;align-items:flex-start;justify-content:center;gap:0;margin-top:10px}
.strand .bead{
  position:relative;width:26px;height:60px;display:flex;align-items:center;justify-content:center;
}
.strand .bead i{
  display:block;width:9px;height:9px;border-radius:50%;
  background:#3A342B;transition:all .28s;
}
.strand .bead.big i{width:13px;height:13px;background:#4A4234}
.strand .bead.past i{background:#7A6444}
.strand .bead.now i{
  width:17px;height:17px;background:var(--candle);
  box-shadow:0 0 0 5px rgba(217,160,91,.16),0 0 22px 4px rgba(217,160,91,.45);
}
.strand .bead.now.pulse i{animation:beadpulse .4s ease-out}
@keyframes beadpulse{0%{transform:scale(1.45)}100%{transform:scale(1)}}

/* 기도문 — 주인공 */
.pray-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:2px 30px 8px}
.prayer-name{font-size:13px;letter-spacing:.30em;color:var(--ash);margin-bottom:12px}
.prayer-text{
  flex:1;min-height:0;overflow-y:auto;text-align:center;
  font-size:19.5px;line-height:1.92;color:var(--vellum);max-width:330px;
  -webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent);
  padding-bottom:26px;
}
.prayer-text::-webkit-scrollbar{display:none}
.prayer-text.long{font-size:16.5px;line-height:1.85;text-align:left}
.prayer-text .fatima{display:block;margin-top:18px;font-size:15.5px;color:var(--ash);line-height:1.85}
.prayer-text .fatima b{display:block;font-size:11px;letter-spacing:.3em;color:var(--ash-dim);font-weight:400;margin-bottom:6px}
.prayer-text.flash{animation:textin .30s ease-out}
@keyframes textin{0%{opacity:.25}100%{opacity:1}}

/* 하단 1/3 — 모든 조작 */
.pray-controls{flex:0 0 282px;display:flex;flex-direction:column;padding:0 18px calc(20px + env(safe-area-inset-bottom));gap:12px}
.ctl-row{display:flex;gap:10px}
.ctl-row button{
  flex:1;padding:15px 0;border-radius:14px;border:1px solid var(--smoke-line);
  color:var(--ash);font-size:14.5px;letter-spacing:.1em;background:rgba(20,18,16,.5);
}
.ctl-row button:active{background:var(--smoke)}
#tapzone{
  flex:1;border-radius:24px;border:1px solid var(--candle-line);
  background:linear-gradient(180deg,rgba(217,160,91,.07),rgba(217,160,91,.13));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;position:relative;overflow:hidden;
}
#tapzone:active{background:linear-gradient(180deg,rgba(217,160,91,.12),rgba(217,160,91,.2))}
#tapzone.pulse{animation:tapglow .35s ease-out}
@keyframes tapglow{0%{box-shadow:inset 0 0 60px rgba(217,160,91,.35)}100%{box-shadow:inset 0 0 0 rgba(217,160,91,0)}}
.tap-label{font-size:19px;color:var(--candle);letter-spacing:.16em;font-weight:600}
.tap-progress{font-size:13px;color:var(--ash);letter-spacing:.14em}

/* ==========================================================================
   기간 기도 (9일기도)
   ========================================================================== */
#view-period .scroll{padding:52px 22px 12px}
.pg-back{color:var(--ash);font-size:13.5px;letter-spacing:.12em;padding:6px 0;margin-bottom:16px;display:inline-flex;align-items:center;gap:7px}
.pg-title{font-size:24px;font-weight:600;line-height:1.35}
.pg-sub{font-size:13.5px;color:var(--ash);margin-top:6px;letter-spacing:.04em}

.field{background:var(--smoke);border:1px solid var(--smoke-line);border-radius:16px;padding:14px 18px;margin-top:12px}
.field .micro{display:block;margin-bottom:6px}
.field-val{font-size:16.5px}
.fields{margin-top:20px}

.cal{margin-top:22px}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cal-cell{
  background:var(--smoke);border:1px solid var(--smoke-line);border-radius:16px;
  padding:13px 8px 11px;text-align:center;
}
.cal-cell .cd{font-size:11.5px;color:var(--ash-dim);letter-spacing:.08em}
.cal-cell .cn{font-size:15.5px;margin-top:3px;color:var(--ash)}
.cal-cell .cs{margin-top:8px;height:12px;display:flex;align-items:center;justify-content:center}
.cal-cell .cs i{width:10px;height:10px;border-radius:50%;display:block;background:transparent;border:1.5px solid #3A342B}
.cal-cell.done{border-color:rgba(217,160,91,.25)}
.cal-cell.done .cn{color:var(--vellum)}
.cal-cell.done .cs i{background:var(--candle);border-color:var(--candle)}
.cal-cell.today{border-color:var(--candle)}
.cal-cell.today .cn{color:var(--candle);font-weight:600}
.cal-cell.today .cs i{border-color:var(--candle)}
.cal-note{font-size:13px;color:var(--ash);line-height:1.75;margin-top:14px;text-align:center}

.period-cta{padding:12px 22px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.btn-candle{
  width:100%;padding:18px;border-radius:18px;text-align:center;
  background:var(--candle);color:#241A0E;font-size:17px;font-weight:600;letter-spacing:.1em;
}
.btn-candle:active{filter:brightness(1.06)}
.btn-ghost{width:100%;padding:13px;border-radius:14px;color:var(--ash-dim);font-size:13.5px;letter-spacing:.08em}

/* ==========================================================================
   완료 화면
   ========================================================================== */
#view-done{justify-content:center;align-items:center;text-align:center;padding:40px;
  background:radial-gradient(80% 50% at 50% 42%,#2A2113 0%,var(--night) 70%)}
.done-flame{font-size:40px;color:var(--candle);text-shadow:0 0 30px rgba(217,160,91,.6)}
.done-title{font-size:24px;font-weight:600;margin-top:22px;line-height:1.5}
.done-sub{font-size:14.5px;color:var(--ash);margin-top:12px;line-height:1.8}
.done-sub b{color:var(--candle);font-weight:600}
#view-done .btn-candle{margin-top:38px;max-width:260px}

/* ==========================================================================
   새 기도 시트 (신비 선택 — 오늘 신비가 기본)
   ========================================================================== */
#sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:30}
#sheet-backdrop.on{display:flex}
#sheet{
  width:100%;background:#1B1815;border-radius:26px 26px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));
  border-top:1px solid var(--smoke-line);animation:sheetup .28s ease-out;
}
@keyframes sheetup{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
.sheet-title{font-size:18px;font-weight:600}
.sheet-sub{font-size:12.5px;color:var(--ash);margin-top:5px;line-height:1.7}
.mys-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.mys-item{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  padding:14px 16px;border-radius:14px;border:1px solid var(--smoke-line);text-align:left;
}
.mys-item .mn{font-size:16px}
.mys-item .md{font-size:12px;color:var(--ash-dim);letter-spacing:.06em}
.mys-item.sel{border-color:var(--candle);background:var(--candle-soft)}
.mys-item.sel .mn{color:var(--candle);font-weight:600}
.mys-item .today-tag{font-size:11px;color:var(--candle);border:1px solid var(--candle-line);border-radius:99px;padding:2px 9px;letter-spacing:.1em;margin-left:8px}
#sheet .btn-candle{margin-top:18px}
#sheet .btn-ghost{margin-top:4px}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">

    <!-- ================= 홈 ================= -->
    <main id="view-home" class="view on">
      <div class="scroll">
        <div class="home-top">
          <div class="wordmark">MY<span>ROSARY</span></div>
          <div id="home-date"></div>
        </div>

        <button class="resume-card" id="resume-card" onclick="resumePray()">
          <span class="micro" id="resume-label">이어서 바치기</span>
          <span class="resume-title" id="resume-title"></span>
          <span class="resume-sub" id="resume-sub"></span>
          <span class="resume-meta" id="resume-meta"></span>
          <span class="resume-go" id="resume-go" aria-hidden="true">›</span>
        </button>

        <div class="quiet-card">
          <span class="micro">오늘의 신비</span>
          <div class="today-name" id="today-mystery"></div>
          <div class="today-desc" id="today-desc"></div>
        </div>

        <button class="quiet-card" onclick="show('view-period')">
          <span class="micro">진행 중인 기간 기도</span>
          <div class="novena-row">
            <span class="novena-title">성모님께 드리는 9일기도</span>
            <span class="novena-count" id="novena-count"></span>
          </div>
          <div class="novena-intent" id="novena-intent"></div>
          <div class="dotrow" id="novena-dots"></div>
        </button>

        <button class="newstart" onclick="openSheet()">새 기도 시작</button>
      </div>
    </main>

    <!-- ================= 기도 화면 ================= -->
    <main id="view-pray" class="view">
      <div class="pray-head" id="pray-head">
        <div class="pray-where" id="pray-where"></div>
        <div class="pray-mystery" id="pray-mystery"></div>
        <div class="pray-medit" id="pray-medit"></div>
        <button class="medit-toggle" id="medit-toggle" onclick="toggleMedit()">묵상 접기</button>
      </div>
      <div class="strand" id="strand" aria-hidden="true"></div>
      <div class="pray-body">
        <div class="prayer-name" id="prayer-name"></div>
        <div class="prayer-text" id="prayer-text"></div>
      </div>
      <div class="pray-controls">
        <div class="ctl-row">
          <button onclick="stepBack()">‹ 이전 알</button>
          <button onclick="exitPray()">나가기</button>
        </div>
        <button id="tapzone" onclick="stepForward()">
          <span class="tap-label" id="tap-label">탭하여 다음 알</span>
          <span class="tap-progress" id="tap-progress"></span>
        </button>
      </div>
    </main>

    <!-- ================= 기간 기도 ================= -->
    <main id="view-period" class="view">
      <div class="scroll">
        <button class="pg-back" onclick="show('view-home')">‹ 홈</button>
        <div class="pg-title">성모님께 드리는<br>9일기도</div>
        <div class="pg-sub" id="pg-sub"></div>

        <div class="fields">
          <div class="field"><span class="micro">지향</span><div class="field-val" id="pg-intent"></div></div>
          <div class="field"><span class="micro">시작일</span><div class="field-val" id="pg-start"></div></div>
        </div>

        <div class="cal">
          <span class="micro">일별 완주</span>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="cal-note">거른 날은 비워 둡니다.<br>오늘 이어 가면 됩니다.</div>
        </div>
      </div>
      <div class="period-cta">
        <button class="btn-candle" id="period-continue" onclick="resumePray()"></button>
      </div>
    </main>

    <!-- ================= 완료 ================= -->
    <main id="view-done" class="view">
      <div class="done-flame">†</div>
      <div class="done-title">오늘의 묵주기도를<br>모두 바쳤습니다</div>
      <div class="done-sub" id="done-sub"></div>
      <button class="btn-candle" onclick="show('view-home')">홈으로</button>
    </main>

    <!-- ================= 새 기도 시트 ================= -->
    <div id="sheet-backdrop" onclick="if(event.target===this)closeSheet()">
      <div id="sheet">
        <div class="sheet-title">새 기도 시작</div>
        <div class="sheet-sub">오늘 요일의 신비가 선택되어 있습니다.<br>진행 중이던 기도는 이력에 남습니다.</div>
        <div class="mys-list" id="mys-list"></div>
        <button class="btn-candle" onclick="startNew()">처음부터 시작</button>
        <button class="btn-ghost" onclick="closeSheet()">닫기</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ==========================================================================
   데이터 — 기도문 전문 (실제 한국어 가톨릭 기도문)
   ========================================================================== */
const PRAYERS = {
  sign:  { name:'성호경', text:'성부와 성자와 성령의 이름으로. 아멘.' },
  creed: { name:'사도신경', long:true, text:'전능하신 천주 성부 천지의 창조주를 저는 믿나이다. 그 외아들 우리 주 예수 그리스도님, 성령으로 인하여 동정 마리아께 잉태되어 나시고, 본시오 빌라도 통치 아래서 고난을 받으시고, 십자가에 못박혀 돌아가시고 묻히셨으며, 저승에 가시어 사흗날에 죽은 이들 가운데서 부활하시고, 하늘에 올라 전능하신 천주 성부 오른편에 앉으시며, 그리로부터 산 이와 죽은 이를 심판하러 오시리라 믿나이다. 성령을 믿으며, 거룩하고 보편된 교회와 모든 성인의 통공을 믿으며, 죄의 용서와 육신의 부활을 믿으며, 영원한 삶을 믿나이다. 아멘.' },
  our:   { name:'주님의 기도', text:'하늘에 계신 우리 아버지, 아버지의 이름이 거룩히 빛나시며 아버지의 나라가 오시며 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서. 오늘 저희에게 일용할 양식을 주시고, 저희에게 잘못한 이를 저희가 용서하오니 저희 죄를 용서하시고, 저희를 유혹에 빠지지 않게 하시고 악에서 구하소서. 아멘.' },
  hail:  { name:'성모송', text:'은총이 가득하신 마리아님, 기뻐하소서! 주님께서 함께 계시니 여인 중에 복되시며 태중의 아들 예수님 또한 복되시나이다. 천주의 성모 마리아님, 이제와 저희 죽을 때에 저희 죄인을 위하여 빌어 주소서. 아멘.' },
  glory: { name:'영광송', text:'영광이 성부와 성자와 성령께 처음과 같이 이제와 항상 영원히. 아멘.' },
  salve: { name:'성모찬송', long:true, text:'모후이시며 사랑이 넘친 어머니, 저희의 생명, 기쁨, 희망이시여! 당신 우러러 하와의 그 자손들이 눈물을 흘리며 부르짖나이다. 슬픔의 골짜기에서 우시는 저희들 곤경을 인자로운 눈으로 굽어보소서. 귀양살이 끝날 그때에 당신의 아드님 우리 주 예수님 뵙게 하소서. 너그러우시고 자애로우시며 오묘하신 동정 마리아님.' }
};
const FATIMA = '예수님, 저희 죄를 용서하시며 저희를 지옥 불에서 구하시고, 연옥 영혼을 돌보시며 가장 버림받은 영혼을 돌보소서.';

/* 신비 4벌 — 단별 명칭(공식)과 한 줄 묵상(자체 작성, 절제) */
const MYSTERIES = {
  joyful: { name:'환희의 신비', days:'월 · 토', decades:[
    ['마리아께서 예수님을 잉태하심','가장 큰 일은 가장 조용한 "예"에서 시작되었습니다.'],
    ['마리아께서 엘리사벳을 찾아보심','은총을 받은 사람은 머물지 않고, 서둘러 길을 나섭니다.'],
    ['마리아께서 예수님을 낳으심','하느님은 화려한 자리가 아니라 구유의 낮은 자리로 오십니다.'],
    ['마리아께서 예수님을 성전에 바치심','가장 귀한 것을 먼저 하느님께 돌려 드립니다.'],
    ['잃으셨던 예수님을 성전에서 찾으심','잃어버린 사흘 끝에, 그분은 아버지의 집에 계셨습니다.']
  ]},
  luminous: { name:'빛의 신비', days:'목', decades:[
    ['예수님께서 세례를 받으심','물에서 올라오실 때 하늘이 열리고, 사랑받는 아들이라 불리셨습니다.'],
    ['카나에서 첫 기적을 행하심','"무엇이든지 그가 시키는 대로 하여라." 잔치의 부족함이 채워집니다.'],
    ['하느님 나라를 선포하심','하느님 나라는 멀리 있지 않고, 돌아서는 마음 안에 이미 와 있습니다.'],
    ['거룩하게 변모하심','산 위의 빛은 내려가 걸어야 할 십자가의 길을 비춥니다.'],
    ['성체성사를 세우심','떠나시기 전, 당신 자신을 양식으로 남기셨습니다.']
  ]},
  sorrowful: { name:'고통의 신비', days:'화 · 금', decades:[
    ['예수님께서 피땀을 흘리심','"아버지의 뜻대로 하소서." 두려움 속에서도 기도는 계속됩니다.'],
    ['예수님께서 매를 맞으심','그분이 맞으신 매로 저희의 상처가 아물었습니다.'],
    ['예수님께서 가시관을 쓰심','조롱의 관을 쓰신 분이 참된 임금이십니다.'],
    ['예수님께서 십자가를 지심','넘어지셔도 다시 일어나 끝까지 걸으십니다.'],
    ['예수님께서 십자가에서 돌아가심','사랑은 목숨을 내어 주는 데까지 갑니다.']
  ]},
  glorious: { name:'영광의 신비', days:'수 · 일', decades:[
    ['예수님께서 부활하심','닫힌 무덤이 열렸습니다. 끝이라 여긴 자리에서 새 아침이 시작됩니다.'],
    ['예수님께서 승천하심','떠나심은 버려두심이 아닙니다. 먼저 가시어 자리를 마련하십니다.'],
    ['성령께서 강림하심','두려워 닫아걸었던 문이 열리고, 불꽃 같은 용기가 내립니다.'],
    ['성모님께서 하늘에 올림을 받으심','평생을 "예"라고 답한 삶이 하늘로 들어올려집니다.'],
    ['성모님께서 천상 모후의 관을 받으심','가장 낮았던 이가 가장 높은 자리에서, 여전히 저희를 위해 빕니다.']
  ]}
};
/* 요일 → 신비 (0=일 … 6=토) */
const DAY_MYSTERY = ['glorious','joyful','sorrowful','glorious','luminous','sorrowful','joyful'];
const DAY_NAMES = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

/* ==========================================================================
   기도 시퀀스 — 평탄한 단계 배열 (인덱스 하나가 곧 위치 = 오차 없는 복원)
   ========================================================================== */
function buildSequence(){
  const seq = [];
  seq.push({p:'sign', d:0});
  seq.push({p:'creed', d:0});
  seq.push({p:'our', d:0});
  for(let i=1;i<=3;i++) seq.push({p:'hail', d:0, n:i, of:3});
  seq.push({p:'glory', d:0});
  for(let d=1;d<=5;d++){
    seq.push({p:'our', d});
    for(let i=1;i<=10;i++) seq.push({p:'hail', d, n:i, of:10});
    seq.push({p:'glory', d, fatima:true});
  }
  seq.push({p:'salve', d:6});
  seq.push({p:'sign', d:6});
  return seq;
}
const SEQ = buildSequence();

function seqIndexOf(d, n){ /* d단의 성모송 n알 인덱스 */
  return SEQ.findIndex(s => s.d===d && s.p==='hail' && s.n===n);
}

/* ==========================================================================
   상태 — localStorage 복원(전화·잠금 중단 시뮬레이션), 최초에는 가짜 시드
   ========================================================================== */
const SEED = { mystery:'glorious', idx:seqIndexOf(3,4), savedAt:'어제 21:42', done:false };
let state, novena;
try{
  state  = JSON.parse(localStorage.getItem('myrosary-state'))  || {...SEED};
  novena = JSON.parse(localStorage.getItem('myrosary-novena')) || { intent:'가족의 건강을 위하여', day:5, total:9, days:['done','done','done','miss','today','','','',''] };
}catch(e){
  state  = {...SEED};
  novena = { intent:'가족의 건강을 위하여', day:5, total:9, days:['done','done','done','miss','today','','','',''] };
}
function persist(){
  try{
    localStorage.setItem('myrosary-state', JSON.stringify(state));
    localStorage.setItem('myrosary-novena', JSON.stringify(novena));
  }catch(e){}
}

/* ==========================================================================
   공통
   ========================================================================== */
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='view-home') renderHome();
  if(id==='view-period') renderPeriod();
}
const $ = id => document.getElementById(id);
const today = new Date();
const mysToday = DAY_MYSTERY[today.getDay()];

function posLabel(idx, my){
  const s = SEQ[idx], m = MYSTERIES[my];
  if(s.d===0) return '시작 기도';
  if(s.d===6) return '마침 기도';
  return m.name+' '+s.d+'단';
}
function beadLabel(idx){
  const s = SEQ[idx];
  if(s.p==='hail') return '성모송 '+s.n+'알';
  return PRAYERS[s.p].name;
}

/* ==========================================================================
   홈
   ========================================================================== */
function renderHome(){
  $('home-date').textContent = (today.getMonth()+1)+'월 '+today.getDate()+'일 '+DAY_NAMES[today.getDay()];

  const card = $('resume-card');
  if(state.done){
    card.classList.add('done');
    $('resume-label').textContent = '오늘의 기도';
    $('resume-title').textContent = '오늘 5단을 모두 바쳤습니다';
    $('resume-sub').textContent = '평화로운 하루 되세요';
    $('resume-meta').textContent = '내일 '+(novena.day+1)+'일째 기도가 기다립니다';
  }else{
    card.classList.remove('done');
    $('resume-label').textContent = '이어서 바치기';
    $('resume-title').textContent = posLabel(state.idx, state.mystery);
    $('resume-sub').textContent = beadLabel(state.idx)+'부터';
    $('resume-meta').textContent = state.savedAt+'에 멈춤 · 탭하면 이어집니다';
  }

  const m = MYSTERIES[mysToday];
  $('today-mystery').textContent = m.name;
  $('today-desc').textContent = DAY_NAMES[today.getDay()]+'에는 '+m.name+'를 바칩니다 — '+m.decades.map((d,i)=>(i+1)+'단 '+d[0]).slice(0,1)[0]+' 외 4단.';

  $('novena-count').textContent = novena.day+'일째 / '+novena.total+'일';
  $('novena-intent').textContent = '지향 · '+novena.intent;
  $('novena-dots').innerHTML = novena.days.map(s=>{
    if(s==='done') return '<i class="d"></i>';
    if(s==='today') return '<i class="t"></i>';
    return '<i></i>';
  }).join('');
}

/* ==========================================================================
   기도 화면
   ========================================================================== */
let meditFolded = false;
function renderPray(pulse){
  const s = SEQ[state.idx];
  const m = MYSTERIES[state.mystery];

  $('pray-where').textContent = posLabel(state.idx, state.mystery);
  if(s.d>=1 && s.d<=5){
    $('pray-mystery').textContent = m.decades[s.d-1][0];
    $('pray-medit').textContent = m.decades[s.d-1][1];
    $('medit-toggle').style.display='';
  }else{
    $('pray-mystery').textContent = s.d===0 ? '십자성호를 긋고 시작합니다' : '기도를 마무리합니다';
    $('pray-medit').textContent = '';
    $('medit-toggle').style.display='none';
  }
  $('pray-head').classList.toggle('folded', meditFolded);

  /* 묵주 스트랜드 — 얕은 호, 현재 알 발광 */
  const strand = $('strand');
  const local = SEQ.map((x,i)=>({...x,i})).filter(x=>x.d===s.d);
  const c = (local.length-1)/2;
  strand.innerHTML = local.map((x,k)=>{
    const big = x.p!=='hail' ? ' big':'';
    const cls = x.i<state.idx ? ' past' : (x.i===state.idx ? ' now'+(pulse?' pulse':'') : '');
    const ty = Math.round(16*(1-Math.pow((k-c)/(c||1),2)));
    return '<span class="bead'+big+cls+'" style="transform:translateY('+ty+'px)"><i></i></span>';
  }).join('');

  /* 기도문 전문 (F6 — 항상 표시) */
  const pr = PRAYERS[s.p];
  $('prayer-name').textContent = pr.name + (s.p==='hail' ? ' — '+s.n+' / '+s.of : '');
  const t = $('prayer-text');
  t.className = 'prayer-text'+(pr.long?' long':'')+' flash';
  t.innerHTML = pr.text + (s.fatima ? '<span class="fatima"><b>구원송</b>'+FATIMA+'</span>' : '');
  t.scrollTop = 0;
  setTimeout(()=>t.classList.remove('flash'), 320);

  /* 하단 */
  const isLast = state.idx===SEQ.length-1;
  $('tap-label').textContent = isLast ? '탭하여 기도 마침' : '탭하여 다음 알';
  $('tap-progress').textContent = (s.d>=1&&s.d<=5)
    ? s.d+'단 · '+(s.p==='hail'? s.n+' / 10' : pr.name)
    : (s.d===0?'시작 기도':'마침 기도');
}
function stepForward(){
  if(state.idx >= SEQ.length-1){ completePrayer(); return; }
  state.idx++;
  saveNow();
  $('tapzone').classList.remove('pulse'); void $('tapzone').offsetWidth;
  $('tapzone').classList.add('pulse');
  renderPray(true);
}
function stepBack(){
  if(state.idx===0) return;
  state.idx--;
  saveNow();
  renderPray(false);
}
function saveNow(){
  state.savedAt = '방금';
  state.done = false;
  persist();
}
function toggleMedit(){
  meditFolded = !meditFolded;
  $('medit-toggle').textContent = meditFolded ? '묵상 펴기' : '묵상 접기';
  $('pray-head').classList.toggle('folded', meditFolded);
}
function exitPray(){ persist(); show('view-home'); }
function resumePray(){ show('view-pray'); renderPray(false); }

function completePrayer(){
  state.done = true;
  if(novena.days[novena.day-1]==='today') novena.days[novena.day-1]='done';
  persist();
  $('done-sub').innerHTML = '9일기도 <b>'+novena.day+'일째</b>가 완주로 기록되었습니다.<br>'+MYSTERIES[state.mystery].name+' 5단 · '+novena.intent;
  show('view-done');
}

/* ==========================================================================
   기간 기도
   ========================================================================== */
function renderPeriod(){
  $('pg-sub').textContent = novena.day+'일째 / '+novena.total+'일 — '+MYSTERIES[mysToday].name;
  $('pg-intent').textContent = novena.intent;
  const start = new Date(today); start.setDate(start.getDate()-(novena.day-1));
  $('pg-start').textContent = (start.getMonth()+1)+'월 '+start.getDate()+'일부터 9일간';

  $('cal-grid').innerHTML = novena.days.map((s,i)=>{
    const d = new Date(start); d.setDate(d.getDate()+i);
    const cls = s==='done'?'done':(s==='today'?'today':'');
    const stat = s==='today' ? '오늘' : (i+1)+'일째';
    return '<div class="cal-cell '+cls+'"><div class="cd">'+stat+'</div><div class="cn">'+(d.getMonth()+1)+'/'+d.getDate()+'</div><div class="cs"><i></i></div></div>';
  }).join('');

  $('period-continue').textContent = state.done ? '오늘 기도를 마쳤습니다' : '계속하기 — '+posLabel(state.idx,state.mystery)+' '+beadLabel(state.idx);
}

/* ==========================================================================
   새 기도 시트 (F3 — 오늘 신비 기본 선택)
   ========================================================================== */
let sheetSel = mysToday;
function openSheet(){
  sheetSel = mysToday;
  renderSheet();
  $('sheet-backdrop').classList.add('on');
}
function closeSheet(){ $('sheet-backdrop').classList.remove('on'); }
function renderSheet(){
  $('mys-list').innerHTML = Object.entries(MYSTERIES).map(([k,m])=>{
    const sel = k===sheetSel ? ' sel':'';
    const tag = k===mysToday ? '<span class="today-tag">오늘</span>':'';
    return '<button class="mys-item'+sel+'" onclick="sheetSel=\''+k+'\';renderSheet()">'+
      '<span><span class="mn">'+m.name+'</span>'+tag+'</span><span class="md">'+m.days+'</span></button>';
  }).join('');
}
function startNew(){
  state = { mystery:sheetSel, idx:0, savedAt:'방금', done:false };
  persist();
  closeSheet();
  resumePray();
}

/* 시작 */
renderHome();
</script>
</body>
</html>
