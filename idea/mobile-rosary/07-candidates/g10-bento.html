<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 10 — 웹 트렌드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#F5F3FF;--soft:rgba(245,243,255,.66);--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.16);--accent:#F2C27B}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{color:var(--ink);font:15px/1.5 "Noto Sans KR",sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:22px 18px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(circle at 20% 10%,#5B3A8A 0%,transparent 45%),radial-gradient(circle at 90% 90%,#1F6F7A 0%,transparent 50%),#111323}
h1{font:600 34px/1.15 "Noto Serif KR",serif;letter-spacing:-.5px}.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.t{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;backdrop-filter:blur(14px)}.t.w{grid-column:1/-1}
.t .k{font-size:11px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}.t .v{font:600 20px/1.3 "Noto Serif KR",serif;margin-top:4px}.t .s{font-size:12px;color:var(--soft);margin-top:4px}
.t.act{background:var(--accent);color:#2A1F0A;border-color:transparent;cursor:pointer}.t.act .k,.t.act .s{color:rgba(42,31,10,.7)}
.t button.tog{border:0;background:rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 12px "Noto Sans KR";margin-top:8px}
.spacer{flex:1}
.pr .a{font:300 22px/1.6 "Noto Serif KR",serif}.pr .b{font:300 22px/1.6 "Noto Serif KR",serif;color:var(--soft);margin-top:12px}.pr.mine .a{color:var(--soft)}.pr.mine .b{color:var(--accent);font-weight:600}
.turn{display:inline-block;margin-top:14px;font-size:12px;letter-spacing:.1em;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--soft)}.turn.mine{border-color:var(--accent);color:var(--accent)}
.beads{display:flex;gap:5px;margin-top:14px}.beads i{flex:1;height:5px;border-radius:3px;background:var(--line)}.beads i.p{background:var(--accent);opacity:.45}.beads i.c{background:var(--accent)}
.btn{border:0;border-radius:14px;padding:14px;font:600 15px "Noto Sans KR";cursor:pointer;min-height:50px}.btn.g{background:var(--glass);border:1px solid var(--line);color:var(--ink)}.btn.a{background:var(--accent);color:#2A1F0A}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{display:flex;gap:22px}.stat b{display:block;font:600 26px "Noto Serif KR",serif}.stat span{font-size:12px;color:var(--soft)}
.pause{position:fixed;inset:0;background:rgba(17,19,35,.86);backdrop-filter:blur(12px);display:grid;place-items:center;padding:22px}
</style></head><body>
<div id="app" style="display:contents"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app");
function render(s){ S=s;
  if(s.phase==="idle"){ app.innerHTML=`<div class="eyebrow">${s.todayName} · ${s.intent}</div><h1>${s.mystName}</h1>
    <div class="grid">
      ${s.pos?`<div class="t w act" data-act="resume"><div class="k">이어서 바치기</div><div class="v">${Rosary.MYST[s.pos.k][0]} · ${s.posWhere}</div><div class="s">${s.posAgo}에 멈췼습니다 · 눌러서 이어가기</div></div><div class="t w" data-act="start" style="cursor:pointer"><div class="k">처음부터</div><div class="v" style="font-size:16px">오늘의 신비를 처음부터 다시</div></div>`:`<div class="t w act" data-act="start"><div class="k">지금 바치기</div><div class="v">5단 · 약 ${R.remainingMin()}분</div><div class="s">앞 절은 앱이 읽고, 뒷 절은 당신이 받습니다</div></div>`}
      <div class="t"><div class="k">진행</div><div class="v">${s.silent?"침묵":"소리"}</div><button class="tog" data-act="silent">바꾸기</button></div>
      <div class="t"><div class="k">받는 사이</div><div class="v">${({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]}</div><button class="tog" data-act="speed">바꾸기</button></div>
      <div class="t"><div class="k">지향</div><div class="v" style="font-size:16px">${s.intents.join(" · ")}</div><button class="tog" data-act="addIntent">+ 추가</button></div>
      <div class="t"><div class="k">바친 횟수</div><div class="v">${s.count}</div><div class="s">순위도 연속 기록도 없습니다</div></div>
    </div>`; return; }
  if(s.phase==="done"){ app.innerHTML=`<div class="eyebrow">${s.mystName}</div><h1>다 바쳤습니다</h1><div class="grid"><div class="t w"><div class="k">${s.intent}을 위하여</div><div class="stat" style="margin-top:10px"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div></div></div><div class="spacer"></div><button class="btn g" data-act="home">돌아가기</button>`; return; }
  const st=s.step, mine=s.phase==="mine";
  app.innerHTML=`<div class="eyebrow">${st.label}</div><h1 style="font-size:20px;font-weight:300;color:var(--soft)">${st.mystery||s.mystName}</h1>
    <div class="grid"><div class="t w"><div class="pr ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div><span class="turn ${mine?'mine':''}">${s.phase==="paused"?"멈춤":mine?"내 차례":"앱이 읽는 중"}</span>
    ${st.of?`<div class="beads">${Array.from({length:st.of},(_,i)=>`<i class="${i<st.bead?'p':i===st.bead?'c':''}"></i>`).join("")}</div>`:""}</div>
    <div class="t"><div class="k">어디쯤</div><div class="v">${s.i+1} <span style="font-size:14px;color:var(--soft)">/ 77</span></div></div><div class="t"><div class="k">남은 시간</div><div class="v">약 ${R.remainingMin()}분</div></div></div>
    <div class="spacer"></div><div class="row"><button class="btn g" data-act="pause">잠시 멈춤</button><button class="btn g" data-act="end">여기서 끝내기</button></div>
    ${s.phase==="paused"?`<div class="pause"><div class="t w" style="width:100%;text-align:center"><h1 style="font-size:26px">멈춰 있습니다</h1><div class="s">${st.label} · 자리는 남아 있습니다</div><div class="row"><button class="btn a" data-act="continue">이어서 바치기</button><button class="btn g" data-act="home">홈으로</button></div></div></div>`:""}`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  ({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?0.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n);}})[a]?.(); });
R.demoFromURL();
</script></body></html>
