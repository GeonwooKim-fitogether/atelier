<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 1 — Hallow식 콘텐츠 허브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F7FB;--card:#fff;--ink:#141824;--muted:#6B7280;--line:#E5E7EB;--accent:#3B5BDB;--accent-soft:#E8EDFF;--gold:#C9A24A}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 92px;overflow:auto}
h1{font-size:22px;font-weight:700;margin:6px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(20,24,36,.06);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2F49B8,#5B7BFF);color:#fff}.hero .k{font-size:12px;opacity:.8}.hero h2{font-size:20px;margin:4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:600 15px "Noto Sans KR";cursor:pointer;min-height:48px}
.btn.p{background:#fff;color:var(--accent)}.btn.a{background:var(--accent);color:#fff;width:100%}.btn.g{background:var(--accent-soft);color:var(--accent);width:100%}
.resume{border:2px solid var(--accent)}.resume .k{color:var(--accent);font-size:12px;font-weight:700}.resume .w{font-size:17px;font-weight:700;margin:2px 0}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.list .row:first-child{border-top:0}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.row .t{flex:1}.row .t b{display:block;font-size:15px}.row .t span{font-size:12px;color:var(--muted)}.row.today .ico{background:var(--accent);color:#fff}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 0 max(10px,env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;font:500 11px "Noto Sans KR";color:var(--muted);display:grid;gap:3px;justify-items:center;padding:6px 0}.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
/* player */
.player{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px}
.art{width:220px;height:220px;border-radius:20px;background:linear-gradient(160deg,#2F49B8,#0E1B5A);display:grid;place-items:center;color:#fff;font-size:15px;text-align:center;padding:16px}
.art b{display:block;font-size:22px;margin-bottom:6px}
.prog{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.meta{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:26px}.ctrl .big{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.ctrl .big svg{width:30px;height:30px;fill:#fff}.ctrl .sm{border:0;background:none;color:var(--muted)}
.text{width:100%;background:var(--card);border-radius:16px;padding:16px;font-size:17px;line-height:1.6}
.text .a{color:var(--ink)}.text .b{color:var(--muted);margin-top:8px}.text.mine .a{color:var(--muted)}.text.mine .b{color:var(--accent);font-weight:700}
.turn{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
.turn.read{color:var(--muted);background:var(--line)}
.overlay{position:fixed;inset:0;background:rgba(20,24,36,.55);display:grid;place-items:center;padding:24px}.overlay .card{width:100%;text-align:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.set .row{justify-content:space-between}.tog{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0}.tog.on{background:var(--accent)}.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tog.on i{left:23px}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:500 13px "Noto Sans KR"}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.done{text-align:center;padding-top:30px}.done .ck{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent);font-size:36px}
</style></head><body>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<script src="engine.js"></script>
<script>
let tab="home"; const R=Rosary.create({onChange:render}); let S=R.snapshot();
const $=s=>document.querySelector(s);
const TABS=[["home","홈","M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],["pray","기도","M12 3v18M6 9h12"],["log","기록","M4 19h16M6 15V9M12 15V5M18 15v-3"],["set","설정","M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 4l2-1-1-3-2 .3a8 8 0 0 0-1.4-1.4L18 4l-3-1-1 2a8 8 0 0 0-2 0L11 3 8 4l.4 2.9A8 8 0 0 0 7 8.3L4 8l-1 3 2 1a8 8 0 0 0 0 2l-2 1 1 3 3-.3a8 8 0 0 0 1.4 1.4L8 20l3 1 1-2a8 8 0 0 0 2 0l1 2 3-1-.4-2.9A8 8 0 0 0 19 15.7l3 .3 1-3-2-1a8 8 0 0 0 0-2z"]];
function render(s){ S=s;
  if(s.phase!=="idle"&&s.phase!=="done") tab="pray"; if(s.phase==="done") tab="pray";
  $("#tabs").innerHTML=TABS.map(([k,n,d])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${n}</button>`).join("");
  const m=$("#main");
  if(tab==="home"){ m.innerHTML=`<div class="sub">${s.todayName}</div><h1>오늘의 기도</h1><div class="sub">${s.intent}을 위하여</div>
    ${s.pos?`<div class="card resume"><div class="k">이어서 바치기</div><div class="w">${Rosary.MYST[s.pos.k][0]} · ${s.posWhere}</div><div class="sub" style="margin:0 0 10px">${s.posAgo}에 멈췄습니다</div><button class="btn a" data-act="resume">이어서 바치기</button></div>`:""}
    <div class="card hero"><div class="k">오늘의 신비</div><h2>${s.mystName}</h2><div style="font-size:13px;opacity:.9;margin-bottom:14px">5단 · 약 ${R.remainingMin()}분 · 앱이 앞 절을 읽고 당신이 뒷 절을 받습니다</div><button class="btn p" data-act="start">▶ ${s.pos?"처음부터 다시":"시작"}</button></div>
    <div class="card list">${Object.entries(Rosary.MYST).map(([k,[n]])=>`<div class="row ${k===s.key?'today':''}"><div class="ico">${n[0]}</div><div class="t"><b>${n}</b><span>${k===s.key?"오늘":"요일에 맞춰 자동으로 바뀝니다"}</span></div></div>`).join("")}</div>
    <div class="card list"><div class="row"><div class="t"><b>지향</b><span>${s.intents.join(" · ")}</span></div><button class="btn g" style="width:auto" data-act="addIntent">+ 추가</button></div></div>`; }
  else if(tab==="pray"){
    if(s.phase==="idle"){ m.innerHTML=`<h1>기도</h1><div class="sub">시작하면 이 화면이 플레이어가 됩니다</div><div class="card"><button class="btn a" data-act="start">▶ ${s.mystName} 시작</button></div>`; return; }
    if(s.phase==="done"){ m.innerHTML=`<div class="done"><div class="ck">✓</div><h1>다 바쳤습니다</h1><div class="sub">${s.mystName} · ${s.intent}을 위하여</div><div class="card stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>걸린 분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><button class="btn g" data-act="home">홈으로</button></div>`; return; }
    const st=s.step, mine=s.phase==="mine";
    m.innerHTML=`<div class="player"><div class="art"><div><b>${st.dec?`제${st.dec}단`:"시작 기도"}</b>${st.mystery||s.mystName}</div></div>
      <div class="prog"><i style="width:${s.progress*100}%"></i></div><div class="meta"><span>${st.label}</span><span>${s.i+1} / 77 · 약 ${R.remainingMin()}분 남음</span></div>
      <span class="turn ${mine?'':'read'}">${s.phase==="paused"?"멈춤":mine?"● 내 차례":"앱이 읽는 중"}</span>
      <div class="text ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div>
      <div class="ctrl"><button class="sm" data-act="end">끝내기</button><button class="big" data-act="${s.phase==="paused"?"continue":"pause"}">${s.phase==="paused"?'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}</button><button class="sm" data-act="silent">${s.silent?"🔕 침묵":"🔈 소리"}</button></div></div>
      ${s.phase==="paused"?`<div class="overlay"><div class="card"><h1>멈춰 있습니다</h1><div class="sub">${st.label} · 자리는 남아 있습니다</div><button class="btn a" data-act="continue" style="margin-bottom:8px">이어서 바치기</button><button class="btn g" data-act="home">홈으로</button></div></div>`:""}`;
  }
  else if(tab==="log"){ m.innerHTML=`<h1>기록</h1><div class="sub">순위도 연속 기록도 없습니다. 바친 횟수만 조용히 셉니다</div><div class="card stat"><div><b>${s.count}</b><span>바친 횟수</span></div><div><b>${s.intents.length}</b><span>지향</span></div><div><b>${s.pos?1:0}</b><span>이어갈 자리</span></div></div>`; }
  else { m.innerHTML=`<h1>설정</h1><div class="card list set"><div class="row"><div class="t"><b>침묵 진행</b><span>소리 없이 진동만</span></div><button class="tog ${s.silent?'on':''}" data-act="silent"><i></i></button></div><div class="row"><div class="t"><b>받는 사이</b><span>뒷 절을 바칠 시간</span></div><div class="seg">${[[0.75,"느리게"],[1,"보통"],[1.35,"빠르게"]].map(([v,n])=>`<button class="${s.speed===v?'on':''}" data-act="speed" data-v="${v}">${n}</button>`).join("")}</div></div><div class="row"><div class="t"><b>한국어 음성</b><span>${s.voice?"이 기기에서 사용 가능":"없음 — 소리 없이 진행됩니다"}</span></div></div></div>`; }
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  if(a==="tab"){ tab=v; render(S); } else if(a==="start") R.start(); else if(a==="resume") R.start({fromSaved:true}); else if(a==="pause") R.pause(); else if(a==="continue") R.resume();
  else if(a==="end") R.end(); else if(a==="home"){ tab="home"; R.home(); } else if(a==="silent") R.toggleSilent(); else if(a==="speed") R.setSpeed(+v); else if(a==="addIntent"){ const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n); } });
R.demoFromURL();
</script></body></html>
