<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방향 2 — 색면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;900&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--night:#101820;--fog:#7E8894;--field:#E8C86A;--paper:#F2EFE8}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--night);color:var(--paper);font:15px/1.62 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.dis{font-family:"Gothic A1","Noto Sans KR",sans-serif;font-weight:900;letter-spacing:-.02em}
#field{position:fixed;inset:0;max-width:430px;margin:0 auto;background:var(--field);transition:background .9s ease}
@media(prefers-reduced-motion:reduce){#field{transition:none}}
#field .sh{position:absolute;left:-14%;top:6%;width:128%;height:52%;opacity:.22}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 22px 0;color:var(--night)}
.k{font-size:11.5px;letter-spacing:.16em;font-weight:500;opacity:.7}
h1{margin-top:5px;font-family:"Gothic A1",sans-serif;font-weight:900;font-size:31px;line-height:1.14;color:var(--night)}
.ladder{display:flex;gap:6px;padding:16px 22px 0}
.ladder i{height:4px;flex:1;background:rgba(16,24,32,.22);border-radius:2px}
.ladder i.on{background:var(--night)}
.sp{flex:1}
.panel{background:var(--night);border-radius:20px 20px 0 0;padding:22px 22px calc(20px + env(safe-area-inset-bottom));min-height:322px;display:flex;flex-direction:column}
.turn{font-size:11.5px;letter-spacing:.16em;font-weight:500;color:var(--fog)}
.turn.mine{color:var(--field)}
.pray{height:246px;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.a{font-size:17.5px;line-height:1.7;color:#8B95A1}
.b{font-size:20px;line-height:1.7;margin-top:9px;color:var(--paper)}
.mine .a{color:#67717D}.mine .b{color:var(--field);font-weight:500}
.row{display:flex;gap:18px;margin-top:auto;padding-top:14px;border-top:1px solid rgba(242,239,232,.14)}
button{font:400 15px/1 "Noto Sans KR";border:0;background:none;color:var(--paper);cursor:pointer}
.row button{font-size:13px;color:var(--fog);min-height:44px}
/* 큰 단추도 블록으로 — 옆에 다른 것이 붙지 않게 */
.go{display:block;font-family:"Gothic A1",sans-serif;font-weight:900;font-size:19px;background:var(--night);color:var(--field);padding:18px 32px;border-radius:40px;align-self:flex-start;min-height:56px}
.go.inv{background:var(--field);color:var(--night)}
.alt{font-size:14px;color:var(--night);opacity:.62;margin-top:12px;display:block;width:100%;min-height:44px}
.card{background:rgba(16,24,32,.09);border-radius:14px;padding:14px 16px;margin-bottom:18px;color:var(--night)}
.card b{font-family:"Gothic A1",sans-serif;font-weight:900;font-size:17px}
.card span{display:block;font-size:12.5px;opacity:.68;margin-top:4px}
.nums{display:flex;gap:26px;margin:18px 0}
.nums b{display:block;font-family:"Gothic A1",sans-serif;font-weight:900;font-size:32px;color:var(--night)}
.nums span{font-size:11.5px;color:var(--night);opacity:.66}
.veil{position:fixed;inset:0;max-width:430px;margin:0 auto;background:rgba(16,24,32,.94);z-index:2;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
.veil h1,.veil .k{color:var(--paper)}
.veil .card{background:rgba(242,239,232,.08);color:var(--paper)}
</style></head><body>
<div id="field"><svg class="sh" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 150 C90 60 150 180 240 96 C310 30 360 120 400 70 L400 200 L0 200 Z" fill="#101820"/></svg></div>
<div class="wrap" id="app"></div>
<script src="engine.js"></script>
<script>
/* 단마다 화면 전체 색이 바뀐다 — 이탈리아 앱의 "단마다 배경이 바뀐다"를 성화 대신 색면으로. */
const FIELD=["#E3DBCB","#E8C86A","#7BA7C4","#D9705B","#C9B8D8","#8FB08A"];
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app"), fl=document.getElementById("field");
function setField(d){ fl.style.background=FIELD[Math.max(0,Math.min(5,d))]; }
function swatches(){ return '<div style="display:flex;gap:7px;padding:16px 22px 0">'+FIELD.slice(1).map((c,k)=>'<div style="flex:1"><div style="height:46px;border-radius:3px;background:'+c+'"></div><div style="font-size:10.5px;color:#101820;opacity:.6;text-align:center;margin-top:5px">제'+(k+1)+'단</div></div>').join("")+'</div><div style="padding:9px 22px 0;font-size:11.5px;color:#101820;opacity:.62">단이 넘어가면 화면 전체 색이 이렇게 바뀝니다</div>'; }
function ladder(d){ let s='<div class="ladder">'; for(let k=1;k<=5;k++) s+='<i class="'+(k<=d?"on":"")+'"></i>'; return s+'</div>'; }
function render(s){ S=s; const dec=s.step?s.step.dec:0; setField(dec);
  if(s.phase==="idle"){ app.innerHTML='<header><div class="k">'+s.todayName.toUpperCase()+'</div><h1>'+s.mystName+'</h1></header>'+ladder(0)+swatches()
   +'<div class="sp"></div><div style="padding:0 22px 26px">'
   +(s.pos?'<div class="card"><b>'+Rosary.MYST[s.pos.k][0]+' · '+s.posWhere+'</b><span>'+s.posAgo+'에 멈췄습니다 · 그날의 신비로 이어집니다</span></div><button class="go inv" data-a="resume">이어서 바치기</button><button class="alt" data-a="start">처음부터 다시</button>':'<div class="card"><b>'+s.intent+'</b><span>다섯 단이 다섯 색입니다 · 약 20분</span></div><button class="go inv" data-a="start">시작</button>')
   +'</div><div class="panel" style="min-height:auto"><div class="row" style="border:0;padding-top:0"><button data-a="silent">'+(s.silent?"침묵 진행":"소리 진행")+'</button><button data-a="speed">받는 사이 '+({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]+'</button><button data-a="addIntent">지향 더하기</button></div></div>'; return; }
  if(s.phase==="done"){ setField(5); app.innerHTML='<header><div class="k">'+s.mystName+'</div><h1>다 바쳤습니다</h1></header>'+ladder(5)+'<div style="padding:14px 22px"><div class="nums"><div><b>50</b><span>성모송</span></div><div><b>'+s.elapsedMin+'</b><span>걸린 분</span></div><div><b>'+s.resumes+'</b><span>이어서</span></div></div><div style="color:#101820;opacity:.7;font-size:14px">'+s.intent+'을 위하여</div></div><div class="sp"></div><div style="padding:0 22px 30px"><button class="go inv" data-a="home">돌아가기</button></div>'; return; }
  const st=s.step, mine=s.phase==="mine";
  app.innerHTML='<header><div class="k">'+st.label+'</div><h1 style="font-size:25px">'+(st.mystery||s.mystName)+'</h1></header>'+ladder(dec)+'<div class="sp"></div>'
   +'<div class="panel"><div class="turn '+(mine?"mine":"")+'">'+(mine?"내 차례 — 뒷 절을 받아 바칩니다":"앱이 앞 절을 읽습니다")+'</div>'
   +'<div class="pray '+(mine?"mine":"")+'"><div class="a">'+st.a+'</div>'+(st.b?'<div class="b">'+st.b+'</div>':'')+'</div>'
   +'<div class="row"><button data-a="pause">잠시 멈춤</button><button data-a="end">여기서 끝내기</button></div></div>'
   +(s.phase==="paused"?'<div class="veil"><div class="k">멈춰 있습니다</div><h1 style="margin:6px 0 14px">'+st.label+'</h1><div class="card"><b>자리는 남아 있습니다</b><span>'+(st.mystery||s.mystName)+'</span></div><button class="go" style="background:'+FIELD[dec]+';color:#101820" data-a="continue">이어서 바치기</button><button class="alt" style="color:#8B95A1;opacity:1" data-a="home">홈으로</button></div>':'');
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)");if(n)R.addIntent(n);}})[b.dataset.a]?.();});
R.demoFromURL();
</script></body></html>
