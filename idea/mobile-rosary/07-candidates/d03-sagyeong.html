<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방향 3 — 사경</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--janji:#EDE6D6;--muk:#16130F;--jumuk:#B03A2E;--geum:#B08D45;--soft:#6B6355;--line:rgba(22,19,15,.16)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--janji);color:var(--muk);font:14px/1.6 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;height:100vh;overflow:hidden;
 background-image:repeating-linear-gradient(90deg,transparent 0 42px,var(--line) 42px 43px)}
.mj{font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.wrap{height:100vh;display:flex;flex-direction:column;padding:20px 18px calc(16px + env(safe-area-inset-bottom))}
.bar{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.16em;color:var(--soft)}
.vert{flex:1;writing-mode:vertical-rl;text-orientation:mixed;display:flex;justify-content:flex-start;align-items:flex-start;gap:20px;padding:18px 4px 8px;overflow:hidden}
.col{font-family:"Nanum Myeongjo",serif;font-size:23px;line-height:1.9;letter-spacing:.06em;max-height:100%}
.col.a{color:var(--muk);font-weight:400}
.col.b{color:var(--soft);font-weight:400}
.mine .col.a{color:#A9A092}.mine .col.b{color:var(--jumuk);font-weight:700}
.ttl{font-family:"Nanum Myeongjo",serif;font-size:15px;color:var(--geum);letter-spacing:.2em}
.rail{position:absolute;right:10px;top:96px;bottom:96px;width:5px;display:flex;flex-direction:column;gap:5px}
.rail i{flex:1;background:rgba(22,19,15,.1)}.rail i.on{background:var(--muk)}.rail i.cur{background:var(--jumuk)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.turn{font-size:11px;letter-spacing:.2em;color:var(--soft)}.turn.mine{color:var(--jumuk)}
button{font:500 14px/1 "Noto Sans KR";border:0;background:none;cursor:pointer;color:var(--soft)}
.seal{width:40px;height:40px;background:var(--jumuk);color:#EDE6D6;font-family:"Nanum Myeongjo",serif;font-size:17px;display:grid;place-items:center;letter-spacing:0}
.home{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px}
h1{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:34px;line-height:1.3}
.who{color:var(--soft);font-size:13px;margin-top:6px}
.b1{font-family:"Nanum Myeongjo",serif;font-size:20px;font-weight:700;color:var(--jumuk);border-bottom:1.5px solid var(--jumuk);padding-bottom:7px;margin-top:22px;align-self:flex-start}
.b2{font-size:13px;margin-top:12px;align-self:flex-start}
.res{font-size:12px;color:var(--soft);margin-top:20px}
.opts{display:flex;gap:18px;margin-top:22px;font-size:12px}.opts button{font-size:12px}
.n{display:flex;gap:26px;margin-top:20px}.n b{display:block;font-family:"Nanum Myeongjo",serif;font-size:26px;font-weight:400}.n span{font-size:11px;color:var(--soft)}
.veil{position:fixed;inset:0;background:rgba(237,230,214,.96);max-width:430px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
</style></head><body>
<div class="wrap" id="ui"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot();
function rail(s){ const d=s.step?s.step.dec:0; return '<div class="rail">'+[1,2,3,4,5].map(i=>'<i class="'+(i<d?"on":i===d?"cur":"")+'"></i>').join("")+'</div>'; }
function render(s){ S=s; const u=document.getElementById("ui");
  if(s.phase==="idle"){ u.innerHTML='<div class="bar"><span>'+s.todayName+'</span><span class="ttl">寫 經</span></div><div class="home"><h1>'+s.mystName+'</h1><div class="who">'+s.intent+'을 위하여</div>'
    +(s.pos?'<div class="res">'+Rosary.MYST[s.pos.k][0]+' · '+s.posWhere+' · '+s.posAgo+'</div><button class="b1" data-a="resume">이어서 베껴 씁니다</button><button class="b2" data-a="start">처음부터 다시</button>':'<button class="b1" data-a="start">첫 줄을 씁니다</button>')
    +'<div class="opts"><button data-a="silent">'+(s.silent?"침묵 진행":"소리로 진행")+'</button><button data-a="speed">받는 사이 '+({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]+'</button></div></div>'; return; }
  if(s.phase==="done"){ u.innerHTML='<div class="bar"><span>'+s.mystName+'</span><span class="ttl">畢</span></div><div class="home"><h1>다 바쳤습니다</h1><div class="who">'+s.intent+'을 위하여</div><div class="n"><div><b>50</b><span>성모송</span></div><div><b>'+s.elapsedMin+'</b><span>걸린 분</span></div><div><b>'+s.resumes+'</b><span>이어서</span></div></div><div class="seal" style="margin-top:22px">畢</div><button class="b2" data-a="home">돌아가기</button></div>'; return; }
  const st=s.step, mine=s.phase==="mine", seal=st.t==="save";
  u.innerHTML='<div class="bar"><span>'+st.label+'</span><span class="ttl">'+(s.i+1)+' / 77</span></div>'+rail(s)
    +'<div class="vert '+(mine?"mine":"")+'"><div class="col a">'+st.a+'</div>'+(st.b?'<div class="col b">'+st.b+'</div>':'')+'</div>'
    +'<div class="foot"><div>'+(seal?'<div class="seal">單</div>':'<span class="turn '+(mine?"mine":"")+'">'+(mine?"내 차례 · 주묵":"앱이 읽는 중 · 먹")+'</span>')+'</div><div style="display:flex;gap:16px"><button data-a="pause">잠시 멈춤</button><button data-a="end">끝내기</button></div></div>'
    +(s.phase==="paused"?'<div class="veil"><h1 style="font-size:26px">멈춰 있습니다</h1><div class="who">'+st.label+' · 자리는 남아 있습니다</div><button class="b1" data-a="continue">이어서 베껴 씁니다</button><button class="b2" data-a="home">홈으로</button></div>':'');
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?.75:1)})[b.dataset.a]?.();});
R.demoFromURL();
</script></body></html>
