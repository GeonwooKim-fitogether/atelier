<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 9 — 위젯 카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#1C1C1E;--soft:#6E6E73;--card:rgba(255,255,255,.82);--line:rgba(0,0,0,.08);--accent:#8E3F4C;--accent-soft:#F6E6E9}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{color:var(--ink);font:15px/1.5 "Noto Sans KR",-apple-system,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:22px;background:linear-gradient(160deg,#F7E9D7 0%,#E9D3C5 40%,#B9C7D6 100%)}
.time{text-align:center;font-size:64px;font-weight:300;letter-spacing:-1px;color:rgba(28,28,30,.85)}.date{text-align:center;font-size:15px;color:rgba(28,28,30,.6);margin-bottom:26px}
.card{background:var(--card);backdrop-filter:blur(18px);border-radius:26px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.6)}
.card .k{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}.card h2{font-size:22px;font-weight:700;margin:4px 0 2px}.card .s{font-size:13px;color:var(--soft)}
.big{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:700 17px "Noto Sans KR";background:var(--accent);color:#fff;margin-top:16px;cursor:pointer;min-height:54px}
.ghost{display:block;width:100%;border:0;border-radius:16px;padding:12px;font:500 14px "Noto Sans KR";background:var(--accent-soft);color:var(--accent);margin-top:8px;cursor:pointer}
.res{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-top:12px}.res b{display:block;font-size:15px}.res span{font-size:12px;color:var(--soft)}
.mini{display:flex;gap:8px;margin-top:12px}.mini button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:500 12px "Noto Sans KR";color:var(--soft)}.mini button.on{border-color:var(--accent);color:var(--accent)}
.pr .a{font-size:19px;line-height:1.6;margin-top:12px}.pr .b{font-size:19px;line-height:1.6;color:var(--soft);margin-top:8px}.pr.mine .a{color:var(--soft)}.pr.mine .b{color:var(--ink);font-weight:700}
.turn{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#EDEDEF;color:var(--soft)}.turn.mine{background:var(--accent-soft);color:var(--accent)}
.beads{display:flex;gap:5px;margin-top:14px}.beads i{flex:1;height:6px;border-radius:3px;background:#E4E4E7}.beads i.p{background:var(--accent);opacity:.4}.beads i.c{background:var(--accent)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:8px}
.stat{display:flex;justify-content:space-around;margin:14px 0 4px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--soft)}
</style></head><body>
<div id="app" style="display:contents"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app");
const clock=()=>{const d=new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;};
function render(s){ S=s;
  if(s.phase==="idle"){ app.innerHTML=`<div class="time">${clock()}</div><div class="date">${new Date().getMonth()+1}월 ${new Date().getDate()}일 ${s.todayName}</div>
    <div class="card"><div class="k">묵주기도 · ${s.intent}</div><h2>${s.mystName}</h2><div class="s">5단 · 약 ${R.remainingMin()}분 · 앞 절은 앱이, 뒷 절은 당신이</div>
    ${s.pos?`<div class="res"><div><b>${Rosary.MYST[s.pos.k][0]} · ${s.posWhere}</b><span>${s.posAgo}에 멈췼습니다</span></div></div><button class="big" data-act="resume">이어서 바치기</button><button class="ghost" data-act="start">처음부터 다시</button>`:`<button class="big" data-act="start">지금 바치기</button>`}
    <div class="mini"><button class="${s.silent?'on':''}" data-act="silent">${s.silent?"침묵":"소리"}</button><button data-act="speed">사이 ${({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]}</button><button data-act="addIntent">지향 +</button></div></div>`; return; }
  if(s.phase==="done"){ app.innerHTML=`<div class="time">${clock()}</div><div class="date">${s.mystName}</div><div class="card"><div class="k">다 바쳤습니다</div><h2>${s.intent}을 위하여</h2><div class="stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><button class="ghost" data-act="home">돌아가기</button></div>`; return; }
  const st=s.step, mine=s.phase==="mine";
  app.innerHTML=`<div class="card"><div class="k">${st.label}</div><h2 style="font-size:16px;font-weight:500;color:var(--soft)">${st.mystery||s.mystName}</h2>
    <div class="pr ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div><span class="turn ${mine?'mine':''}">${s.phase==="paused"?"멈춤":mine?"내 차례":"앱이 읽는 중"}</span>
    ${st.of?`<div class="beads">${Array.from({length:st.of},(_,i)=>`<i class="${i<st.bead?'p':i===st.bead?'c':''}"></i>`).join("")}</div>`:""}<div class="foot"><span>${s.i+1} / 77</span><span>약 ${R.remainingMin()}분 남음</span></div>
    ${s.phase==="paused"?`<button class="big" data-act="continue">이어서 바치기</button><button class="ghost" data-act="home">홈으로 — 자리는 남습니다</button>`:`<div class="mini"><button data-act="pause">잠시 멈춤</button><button data-act="end">끝내기</button><button class="${s.silent?'on':''}" data-act="silent">${s.silent?"침묵":"소리"}</button></div>`}</div>`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  ({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?0.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n);}})[a]?.(); });
R.demoFromURL();
</script></body></html>
