<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 4 — 세션 플레이어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
:root{--ink:#F4F1EA;--soft:rgba(244,241,234,.66);--glass:rgba(255,255,255,.10);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{color:var(--ink);font:15px/1.5 "Noto Sans KR",sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:26px 22px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(170deg,#1B2A4A 0%,#3A3F73 45%,#7A4F6E 100%)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--soft)}
h1{font-size:26px;font-weight:300;margin-top:16px}.soft{color:var(--soft);font-size:14px}
.spacer{flex:1}
.circle{width:250px;height:250px;margin:24px auto;border-radius:50%;display:grid;place-items:center;position:relative}
.circle .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,.04) 70%);transform:scale(.86);transition:transform 3.6s ease-in-out}
.circle.read .ring{transform:scale(1)}.circle.mine .ring{animation:breath 4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.86)}50%{transform:scale(1)}}
.circle .in{position:relative;text-align:center}.circle .in b{display:block;font-size:44px;font-weight:300}.circle .in span{font-size:13px;color:var(--soft)}
.btn{border:0;border-radius:999px;padding:16px 26px;font:500 16px "Noto Sans KR";cursor:pointer;min-height:54px}
.btn.p{background:var(--ink);color:#2A2F55;width:100%}.btn.g{background:var(--glass);color:var(--ink);border:1px solid var(--line);width:100%;margin-top:8px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px)}
.card .k{font-size:12px;color:var(--soft)}.card .w{font-size:18px;margin:2px 0 8px}
.opts{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:16px}.opts button{border:0;background:none;color:var(--soft);font:inherit;cursor:pointer;border-bottom:1px dotted var(--line)}
.text{text-align:center;font-size:18px;line-height:1.65;padding:0 6px}.text .b{color:var(--soft);margin-top:8px}.text.mine .a{color:var(--soft)}.text.mine .b{color:var(--ink);font-weight:500}
.turn{text-align:center;margin-top:10px;font-size:13px;color:var(--soft);letter-spacing:.06em}.turn.mine{color:#FFD9A0}
.ctrl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:20px}
.ctrl .big{width:80px;height:80px;border-radius:50%;background:var(--ink);border:0;display:grid;place-items:center;cursor:pointer}.ctrl .big svg{width:32px;height:32px;fill:#2A2F55}
.ctrl .sm{border:0;background:none;color:var(--soft);font:13px "Noto Sans KR";cursor:pointer}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:22px}.bar i{display:block;height:100%;background:var(--ink)}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.stat{display:flex;gap:26px;justify-content:center;margin:18px 0}.stat b{display:block;font-size:26px;font-weight:300}.stat span{font-size:12px;color:var(--soft)}
.pause{position:fixed;inset:0;background:rgba(27,42,74,.82);backdrop-filter:blur(10px);display:grid;place-items:center;padding:24px}
</style></head><body>
<div id="app" style="display:contents"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app");
function render(s){ S=s;
  if(s.phase==="idle"){ app.innerHTML=`<div class="top"><span>${s.todayName}</span><span>${s.intent}</span></div><h1>${s.mystName}</h1><div class="soft">5단 · 약 ${R.remainingMin()}분</div>
    <div class="circle"><div class="ring"></div><div class="in"><b>5</b><span>단</span></div></div><div class="spacer"></div>
    ${s.pos?`<div class="card"><div class="k">이어서</div><div class="w">${Rosario_name(s.pos.k)} · ${s.posWhere}</div><div class="k" style="margin-bottom:10px">${s.posAgo}에 멈췼습니다</div><button class="btn p" data-act="resume">▶ 이어서 바치기</button><button class="btn g" data-act="start">처음부터</button></div>`:`<button class="btn p" data-act="start">▶ 시작</button>`}
    <div class="opts"><button data-act="silent">${s.silent?"침묵 진행":"소리 진행"}</button><button data-act="speed">사이 · ${({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]}</button><button data-act="addIntent">지향 ${s.intents.length}</button></div>`; return; }
  if(s.phase==="done"){ app.innerHTML=`<div class="top"><span>${s.mystName}</span><span>${s.intent}</span></div><div class="spacer"></div><div class="circle"><div class="ring" style="transform:scale(1)"></div><div class="in"><b>✓</b><span>다 바쳤습니다</span></div></div><div class="stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><div class="spacer"></div><button class="btn g" data-act="home">돌아가기</button>`; return; }
  const st=s.step, mine=s.phase==="mine", ph=s.phase==="reading"?"read":mine?"mine":"";
  app.innerHTML=`<div class="top"><span>${st.label}</span><span>${st.mystery||s.mystName}</span></div>
    <div class="circle ${ph}"><div class="ring"></div><div class="in"><b>${st.bead>=0?st.bead+1:"·"}</b><span>${st.of?`/ ${st.of}`:st.dec?`제${st.dec}단`:"시작 기도"}</span></div></div>
    <div class="text ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div><div class="turn ${mine?'mine':''}">${s.phase==="paused"?"멈춤":mine?"내 차례 — 받아 바치는 시간":"앱이 읽고 있습니다"}</div>
    <div class="spacer"></div><div class="bar"><i style="width:${s.progress*100}%"></i></div><div class="time"><span>${s.i+1} / 77</span><span>약 ${R.remainingMin()}분 남음</span></div>
    <div class="ctrl"><button class="sm" data-act="end">끝내기</button><button class="big" data-act="${s.phase==="paused"?"continue":"pause"}">${s.phase==="paused"?'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}</button><button class="sm" data-act="silent">${s.silent?"침묵":"소리"}</button></div>
    ${s.phase==="paused"?`<div class="pause"><div class="card" style="width:100%;text-align:center"><h1 style="margin:0 0 6px">멈춰 있습니다</h1><div class="soft">${st.label} · 자리는 남아 있습니다</div><button class="btn p" data-act="continue" style="margin-top:16px">▶ 이어서 바치기</button><button class="btn g" data-act="home">홈으로</button></div></div>`:""}`; }
function Rosario_name(k){ return Rosary.MYST[k][0]; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  ({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?0.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n);}})[a]?.(); });
R.demoFromURL();
</script></body></html>
