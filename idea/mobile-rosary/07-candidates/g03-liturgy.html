<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 3 — 전례 텍스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&display=swap">
<style>
:root{--paper:#FBFAF6;--ink:#1F2530;--soft:#6B6F76;--rule:#E4E1D8;--season:#7E8B6B}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.7 "Noto Serif KR",serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:28px 26px calc(24px + env(safe-area-inset-bottom))}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--season);font-weight:600}
h1{font-size:30px;font-weight:300;line-height:1.25;margin:6px 0 4px}.soft{color:var(--soft);font-size:14px}
hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.rule-season{height:3px;background:var(--season);width:48px;margin:10px 0 0}
.spacer{flex:1}
.btn{display:block;width:100%;border:0;background:none;border-top:1px solid var(--ink);padding:16px 0;text-align:left;font:400 18px "Noto Serif KR";cursor:pointer;color:var(--ink)}
.btn.soft{color:var(--soft);border-top-color:var(--rule);font-size:15px}
.btn .r{float:right;color:var(--season)}
.resume .w{font-size:20px;margin-top:4px}
.opts{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:14px}.opts button{border:0;background:none;font:inherit;color:var(--soft);text-decoration:underline dotted;cursor:pointer}
.pr .a{font-size:22px;line-height:1.7;font-weight:600}.pr .b{font-size:22px;line-height:1.7;font-weight:300;color:var(--soft);margin-top:14px}
.pr.mine .a{font-weight:300;color:var(--soft)}.pr.mine .b{font-weight:600;color:var(--ink)}
.pr.mine .b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--season);margin-right:10px;vertical-align:middle}
.pos{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:6px}
.beads{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}.beads i{height:4px;background:var(--rule)}.beads i.p{background:var(--season)}.beads i.c{background:var(--ink)}
.stat{display:flex;gap:26px;margin:14px 0 6px}.stat b{display:block;font-size:26px;font-weight:300}.stat span{font-size:12px;color:var(--soft)}
.pause{position:fixed;inset:0;background:rgba(251,250,246,.94);display:flex;flex-direction:column;justify-content:center;padding:26px;max-width:430px;margin:0 auto}
</style></head><body>
<div id="app" style="display:contents"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app");
const SEASON=(()=>{const m=new Date().getMonth()+1; return m===12||m===3||m===4?["#6E4B7A","대림·사순"]:m===5||m===8?["#8E3F4C","성모 성월"]:m===6?["#B0442E","성령 강림"]:["#7E8B6B","연중 시기"];})();
document.documentElement.style.setProperty("--season",SEASON[0]);
function render(s){ S=s;
  if(s.phase==="idle"){ app.innerHTML=`<div class="eyebrow">${SEASON[1]} · ${s.todayName}</div><h1>${s.mystName}</h1><div class="soft">${s.intent}을 위하여</div><div class="rule-season"></div><div class="spacer"></div>
    ${s.pos?`<div class="resume"><div class="soft">${s.posAgo}에 멈췼습니다</div><button class="btn" data-act="resume">${Rosary.MYST[s.pos.k][0]}, ${s.posWhere}부터 이어서<span class="r">→</span></button></div><button class="btn soft" data-act="start">처음부터 다시</button>`:`<button class="btn" data-act="start">시작하기<span class="r">→</span></button>`}
    <div class="opts"><button data-act="silent">${s.silent?"침묵으로 바침":"소리로 바침"}</button><button data-act="speed">받는 사이 ${({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]}</button><button data-act="addIntent">지향 ${s.intents.length}</button></div>`; return; }
  if(s.phase==="done"){ app.innerHTML=`<div class="eyebrow">${SEASON[1]}</div><h1>다 바쳤습니다</h1><div class="soft">${s.mystName} · ${s.intent}을 위하여</div><div class="rule-season"></div><div class="stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><div class="spacer"></div><button class="btn" data-act="home">돌아가기<span class="r">→</span></button>`; return; }
  const st=s.step, mine=s.phase==="mine", of=st.of||0;
  app.innerHTML=`<div class="eyebrow">${st.label}</div><div class="soft">${st.mystery||s.mystName}</div><hr>
    <div class="pr ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div>
    <div class="spacer"></div>
    ${of?`<div class="beads">${Array.from({length:of},(_,i)=>`<i class="${i<st.bead?'p':i===st.bead?'c':''}"></i>`).join("")}</div>`:""}
    <div class="pos"><span>${mine?"내 차례":"앱이 읽고 있습니다"}</span><span>${s.i+1} / 77</span></div>
    <button class="btn soft" data-act="pause" style="margin-top:14px">잠시 멈춤 — 자리가 남습니다</button><button class="btn soft" data-act="end">여기서 끝내기</button>
    ${s.phase==="paused"?`<div class="pause"><div class="eyebrow">멈춰 있습니다</div><h1>${st.label}</h1><div class="soft">자리는 남아 있습니다</div><div class="rule-season"></div><div style="height:30px"></div><button class="btn" data-act="continue">이어서 바치기<span class="r">→</span></button><button class="btn soft" data-act="home">홈으로</button></div>`:""}`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  ({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?0.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n);}})[a]?.(); });
R.demoFromURL();
</script></body></html>
