<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>장르 6 — 손으로 넘기는 묵주</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--bg:#1A1410;--wood:#5A3A28;--bead:#8B5A3C;--bead-hi:#D9AE4C;--bead-past:#3E2A1E;--ink:#F0EAD9;--soft:#A89C8A}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#2A1E16,#1A1410 70%);color:var(--ink);font:15px/1.5 "Noto Sans KR",sans-serif;max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.chain{position:absolute;inset:0;z-index:0}.chain svg{width:100%;height:100%}
.ui{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.top{text-align:center;font-family:"Noto Serif KR",serif}.top .d{font-size:12px;color:var(--soft);letter-spacing:.1em}.top h1{font-size:22px;font-weight:400;margin-top:4px}
.spacer{flex:1}
.hint{text-align:center;color:var(--soft);font-size:13px}
.text{text-align:center;font-family:"Noto Serif KR",serif;font-size:18px;line-height:1.65;padding:0 6px}.text .b{color:var(--soft);margin-top:8px}.text.mine .a{color:var(--soft)}.text.mine .b{color:var(--bead-hi)}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font:500 16px "Noto Sans KR";cursor:pointer;min-height:52px}.btn.c{background:var(--bead-hi);color:#1A1205}.btn.o{background:rgba(240,234,217,.08);color:var(--ink);border:1px solid rgba(240,234,217,.2);margin-top:8px}
.panel{background:rgba(26,20,16,.7);border:1px solid rgba(240,234,217,.12);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.row{display:flex;gap:8px;margin-top:10px}.chip{flex:1;border:1px solid rgba(240,234,217,.22);border-radius:10px;padding:9px;text-align:center;font-size:13px;background:none;color:var(--ink)}.chip.on{background:rgba(217,174,76,.18);border-color:var(--bead-hi)}
.tap{position:absolute;inset:0;z-index:1}
.turn{text-align:center;margin-top:10px;font-size:12px;letter-spacing:.12em;color:var(--soft)}.turn.mine{color:var(--bead-hi)}
.pause{position:absolute;inset:0;z-index:3;background:rgba(26,20,16,.85);display:grid;place-items:center;padding:24px}
.stat{display:flex;justify-content:center;gap:22px;margin:14px 0}.stat b{display:block;font-size:24px;font-family:"Noto Serif KR"}.stat span{font-size:12px;color:var(--soft)}
</style></head><body>
<div class="chain" id="chain"></div>
<div class="ui" id="ui"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); let manual=false;
function chain(s){ // 화면 전체가 묵주 — 큰 고리 + 늘어진 십자가. 지금 알은 크고 밝다
  const cx=195, cy=400, rx=150, ry=230, n=55; const st=s.step; const cur= st? (st.dec? (st.dec-1)*11+(st.bead>=0?st.bead+1:0) : (st.bead>=0?st.bead:0)) : -1; let out="";
  out+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#5A3A28" stroke-width="3"/>`;
  for(let i=0;i<n;i++){ const a=(90+i*360/n)*Math.PI/180, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a), big=i%11===0;
    const active=s.phase!=="idle"&&s.phase!=="done"; const fill= !active? "#8B5A3C" : i<cur? "#3E2A1E" : i===cur? "#D9AE4C" : "#8B5A3C"; const r= i===cur&&active? 22 : big? 13 : 10;
    out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#1A1410" stroke-width="2"/>`; if(i===cur&&active) out+=`<circle cx="${x}" cy="${y}" r="32" fill="none" stroke="#D9AE4C" stroke-opacity=".5" stroke-width="2"/>`; }
  out+=`<line x1="${cx}" y1="${cy+ry}" x2="${cx}" y2="${cy+ry+70}" stroke="#5A3A28" stroke-width="3"/>`; for(const dy of [22,44]) out+=`<circle cx="${cx}" cy="${cy+ry+dy}" r="10" fill="#8B5A3C" stroke="#1A1410" stroke-width="2"/>`;
  out+=`<path d="M${cx-18} ${cy+ry+92} h36 M${cx} ${cy+ry+72} v42" stroke="#D9AE4C" stroke-width="6" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">${out}</svg>`; }
function render(s){ S=s; document.getElementById("chain").innerHTML=chain(s); const u=document.getElementById("ui");
  if(s.phase==="idle"){ u.innerHTML=`<div class="top"><div class="d">${s.todayName}</div><h1>${s.mystName}</h1></div><div class="spacer"></div><div class="panel">
    ${s.pos?`<div class="hint" style="margin-bottom:10px">${Rosary.MYST[s.pos.k][0]} · ${s.posWhere} · ${s.posAgo}</div><button class="btn c" data-act="resume">이어서 바치기</button><button class="btn o" data-act="start">처음부터</button>`:`<button class="btn c" data-act="start">묵주를 잡습니다</button>`}
    <div class="row"><button class="chip ${manual?'on':''}" data-act="manual">${manual?"손으로 넘김":"저절로 넘김"}</button><button class="chip ${s.silent?'on':''}" data-act="silent">${s.silent?"침묵":"소리"}</button></div><div class="hint" style="margin-top:10px">손으로 넘김: 알을 톡 치면 다음 기도로 갑니다</div></div>`; return; }
  if(s.phase==="done"){ u.innerHTML=`<div class="spacer"></div><div class="panel" style="text-align:center"><div class="top"><h1>다 바쳤습니다</h1></div><div class="hint">${s.mystName} · ${s.intent}</div><div class="stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><button class="btn o" data-act="home">묵주를 놓습니다</button></div>`; return; }
  const st=s.step, mine=s.phase==="mine";
  u.innerHTML=`<div class="top"><div class="d">${st.label}</div><h1 style="font-size:16px;color:var(--soft)">${st.mystery||s.mystName}</h1></div><div class="tap" data-act="next"></div><div class="spacer"></div>
    <div class="panel"><div class="text ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div><div class="turn ${mine?'mine':''}">${s.phase==="paused"?"멈춤":manual?"● 알을 톡 치면 넘어갑니다":mine?"● 내 차례":"앱이 읽고 있습니다"}</div>
    <div class="row"><button class="chip" data-act="pause">잠시 멈춤</button><button class="chip" data-act="end">끝내기</button></div></div>
    ${s.phase==="paused"?`<div class="pause"><div class="panel" style="width:100%;text-align:center"><div class="top"><h1>멈춰 있습니다</h1></div><div class="hint">${st.label} · 자리는 남아 있습니다</div><button class="btn c" data-act="continue" style="margin-top:14px">이어서 바치기</button><button class="btn o" data-act="home">홈으로</button></div></div>`:""}`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act;
  ({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),manual:()=>{manual=!manual;render(S);},next:()=>{ if(manual) R.next(); }})[a]?.(); });
R.demoFromURL();
</script></body></html>
