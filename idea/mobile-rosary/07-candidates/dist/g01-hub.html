<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F7FB;--card:#fff;--ink:#141824;--muted:#6B7280;--line:#E5E7EB;--accent:#3B5BDB;--accent-soft:#E8EDFF;--gold:#C9A24A}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:18px 18px 92px;overflow:auto}
h1{font-size:22px;font-weight:700;margin:6px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(20,24,36,.06);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2F49B8,#5B7BFF);color:#fff}.hero .k{font-size:12px;opacity:.8}.hero h2{font-size:20px;margin:4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:600 15px "Noto Sans KR";cursor:pointer;min-height:48px}
.btn.p{background:#fff;color:var(--accent)}.btn.a{background:var(--accent);color:#fff;width:100%}.btn.g{background:var(--accent-soft);color:var(--accent);width:100%}
.resume{border:2px solid var(--accent)}.resume .k{color:var(--accent);font-size:12px;font-weight:700}.resume .w{font-size:17px;font-weight:700;margin:2px 0}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.list .row:first-child{border-top:0}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.row .t{flex:1}.row .t b{display:block;font-size:15px}.row .t span{font-size:12px;color:var(--muted)}.row.today .ico{background:var(--accent);color:#fff}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 0 max(10px,env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;font:500 11px "Noto Sans KR";color:var(--muted);display:grid;gap:3px;justify-items:center;padding:6px 0}.tabs button.on{color:var(--accent)}

.ctrl .big svg{width:30px;height:30px;fill:#fff}.ctrl .sm{border:0;background:none;color:var(--muted)}
.text{width:100%;background:var(--card);border-radius:16px;padding:16px;font-size:17px;line-height:1.6}
.text .a{color:var(--ink)}.text .b{color:var(--muted);margin-top:8px}.text.mine .a{color:var(--muted)}.text.mine .b{color:var(--accent);font-weight:700}
.turn{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}

.overlay{position:fixed;inset:0;background:rgba(20,24,36,.55);display:grid;place-items:center;padding:24px}.overlay .card{width:100%;text-align:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}
.set .row{justify-content:space-between}.tog{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0}.tog.on{background:var(--accent)}.tog i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tog.on i{left:23px}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:500 13px "Noto Sans KR"}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.done{text-align:center;padding-top:30px}.done .ck{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent);font-size:36px}
</style></head><body>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<script>/* 묵주기도 공용 엔진 — 후보 열 개가 이 위에서 돈다.
   여기가 고정이고(77단계·상태 기계·자리 저장·음성·진동), 껍데기(구조·색·동작 감각)는 각 후보가 정한다.
   06-prd.md §1 · 06-screen-spec.md 비화면 채널 명세 · 06-screen-map.md 결함 2·5·7 처방을 담고 있다. */
(function(){
const P={
  sign:{a:"성부와 성자와 성령의 이름으로. 아멘.",b:""},
  creed:{a:"전능하신 천주 성부, 천지의 창조주를 저는 믿나이다.",b:""},
  our:{a:"하늘에 계신 우리 아버지, 아버지의 이름이 거룩히 빛나시며 아버지의 나라가 오시며 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지소서.",
       b:"오늘 저희에게 일용할 양식을 주시고 저희에게 잘못한 이를 저희가 용서하오니 저희 죄를 용서하시고 저희를 유혹에 빠지지 않게 하시고 악에서 구하소서. 아멘."},
  hail:{a:"은총이 가득하신 마리아님, 기뻐하소서! 주님께서 함께 계시니 여인 중에 복되시며 태중의 아들 예수님 또한 복되시나이다.",
        b:"천주의 성모 마리아님, 이제와 저희 죽을 때에 저희 죄인을 위하여 빌어주소서. 아멘."},
  glory:{a:"영광이 성부와 성자와 성령께,",b:"처음과 같이 이제와 항상 영원히. 아멘."},
  save:{a:"예수님, 저희 죄를 용서하시며 저희를 지옥 불에서 구하시고,",b:"연옥 영혼을 도우시며 가장 버림받은 영혼을 구원하소서."}
};
const MYST={
  joy:["환희의 신비",["마리아님께서 예수님을 잉태하심","마리아님께서 엘리사벳을 찾아보심","마리아님께서 예수님을 낳으심","마리아님께서 예수님을 성전에 바치심","마리아님께서 잃으셨던 예수님을 성전에서 찾으심"]],
  light:["빛의 신비",["예수님께서 요르단 강에서 세례 받으심","예수님께서 카나에서 첫 기적을 행하심","예수님께서 하느님 나라를 선포하심","예수님께서 거룩하게 변모하심","예수님께서 성체성사를 세우심"]],
  sorrow:["고통의 신비",["예수님께서 우리를 위하여 피땀 흘리심","예수님께서 우리를 위하여 매맞으심","예수님께서 우리를 위하여 가시관 쓰심","예수님께서 우리를 위하여 십자가 지심","예수님께서 우리를 위하여 십자가에 못박혀 돌아가심"]],
  glory:["영광의 신비",["예수님께서 부활하심","예수님께서 승천하심","성령께서 강림하심","성모님께서 하늘에 올림을 받으심","성모님께서 하늘의 여왕으로 관을 쓰심"]]
};
const DAYS=["glory","joy","sorrow","glory","light","sorrow","joy"];
const DAYNM=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const TOTAL=77;

function build(key){
  const [name,list]=MYST[key], q=[]; let n=0;
  const push=o=>{o.n=++n; o.total=TOTAL; q.push(o);};
  push({t:"sign",a:P.sign.a,b:"",label:"시작 기도",dec:0,bead:-1});
  push({t:"creed",a:P.creed.a,b:"",label:"시작 기도",dec:0,bead:-1});
  push({t:"our",a:P.our.a,b:P.our.b,label:"시작 기도",dec:0,bead:-1});
  for(let i=0;i<3;i++) push({t:"hail",a:P.hail.a,b:P.hail.b,label:"시작 기도",dec:0,bead:i,of:3});
  push({t:"glory",a:P.glory.a,b:P.glory.b,label:"시작 기도",dec:0,bead:-1});
  for(let d=1;d<=5;d++){
    const m=list[d-1];
    push({t:"decl",a:m+"을 묵상합시다.",b:"",label:`제${d}단`,dec:d,bead:-1,mystery:m});
    push({t:"our",a:P.our.a,b:P.our.b,label:`제${d}단`,dec:d,bead:-1,mystery:m});
    for(let i=0;i<10;i++) push({t:"hail",a:P.hail.a,b:P.hail.b,label:`제${d}단 · ${i+1}번째 알`,dec:d,bead:i,of:10,mystery:m});
    push({t:"glory",a:P.glory.a,b:P.glory.b,label:`제${d}단`,dec:d,bead:-1,mystery:m});
    push({t:"save",a:P.save.a,b:P.save.b,label:`제${d}단`,dec:d,bead:-1,mystery:m});
  }
  return q;
}
const today=()=>DAYS[new Date().getDay()];
function ago(ms){
  const m=Math.round((Date.now()-ms)/60000);
  if(m<1) return "방금"; if(m<60) return `${m}분 전`;
  const h=Math.round(m/60); if(h<24) return `${h}시간 전`; if(h<48) return "어제"; return `${Math.round(h/24)}일 전`;
}
function where(pos){ // 사람이 읽는 자리
  if(!pos) return "";
  const q=build(pos.k), s=q[Math.min(pos.i,TOTAL-1)];
  return s.dec===0 ? "시작 기도" : (s.bead>=0 ? `제${s.dec}단 ${s.bead+1}번째 알` : `제${s.dec}단`);
}

/* ── 저장: 지향별 자리 (결함 7 처방) ── */
const store={
  intents(){ try{ const v=JSON.parse(localStorage.getItem("mr2.intents")||"null"); if(Array.isArray(v)&&v.length) return v; }catch(e){} return ["오늘의 지향"]; },
  setIntents(a){ try{ localStorage.setItem("mr2.intents",JSON.stringify(a)); }catch(e){} },
  pos(intent){ try{ return JSON.parse(localStorage.getItem("mr2.pos."+intent)||"null"); }catch(e){ return null; } },
  save(intent,pos){ try{ localStorage.setItem("mr2.pos."+intent,JSON.stringify(pos)); }catch(e){} },
  clear(intent){ try{ localStorage.removeItem("mr2.pos."+intent); }catch(e){} },
  set(){ try{ return JSON.parse(localStorage.getItem("mr2.set")||"{}"); }catch(e){ return {}; } },
  setSet(o){ try{ localStorage.setItem("mr2.set",JSON.stringify(o)); }catch(e){} },
  count(){ try{ return +localStorage.getItem("mr2.count")||0; }catch(e){ return 0; } },
  bump(){ try{ localStorage.setItem("mr2.count",String(store.count()+1)); }catch(e){} },
};

/* ── 음성·진동 ── */
let voice=null, voiceChecked=false;
function pickVoice(){
  if(voiceChecked) return voice;
  try{ const v=(speechSynthesis.getVoices()||[]).find(x=>/^ko/i.test(x.lang)); voice=v||null; voiceChecked=(speechSynthesis.getVoices()||[]).length>0; }catch(e){ voice=null; voiceChecked=true; }
  return voice;
}
try{ speechSynthesis.onvoiceschanged=()=>{ voiceChecked=false; pickVoice(); }; }catch(e){}
const canSpeak=()=>{ try{ return !!pickVoice(); }catch(e){ return false; } };
function speak(text){
  return new Promise(res=>{
    if(!canSpeak()){ setTimeout(res, text.length*118); return; }
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.voice=voice; u.lang="ko-KR"; u.rate=0.92; let done=false;
      const fin=()=>{ if(!done){ done=true; res(); } }; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); setTimeout(fin, text.length*200+3000);
    }catch(e){ setTimeout(res, text.length*118); }
  });
}
const VIB={bead:[18],decade:[28,60,28,60,28],silentOn:[20,50,20],done:[200]};
function buzz(k){ try{ navigator.vibrate&&navigator.vibrate(VIB[k]); }catch(e){} }

/* ── 세션 ── */
function create(opts){
  opts=opts||{};
  const set=store.set();
  const S={ key:today(), intent:store.intents()[0], q:[], i:0, phase:"idle", silent:!!set.silent, speed:set.speed||1,
            t0:0, elapsed:0, resumes:0, timer:null, gen:0 };
  const emit=()=>{ opts.onChange&&opts.onChange(snapshot()); };
  function snapshot(){
    const step=S.q[S.i]||null;
    return { phase:S.phase, i:S.i, total:TOTAL, step, key:S.key, mystName:MYST[S.key][0], mystList:MYST[S.key][1],
      intent:S.intent, intents:store.intents(), silent:S.silent, speed:S.speed, voice:canSpeak(),
      pos:store.pos(S.intent), posWhere:where(store.pos(S.intent)), posAgo:store.pos(S.intent)?ago(store.pos(S.intent).at):"",
      elapsedMin:Math.round((S.elapsed+(S.t0?Date.now()-S.t0:0))/60000), resumes:S.resumes, count:store.count(),
      todayName:DAYNM[new Date().getDay()], progress:S.i/TOTAL };
  }
  const clear=()=>{ if(S.timer){ clearTimeout(S.timer); S.timer=null; } try{ speechSynthesis.cancel(); }catch(e){} };
  const speedFactor=()=>({0.75:0.75,1:1,1.35:1.35})[S.speed]||1;
  function gapMs(step){
    if(step.t==="decl") return 2200;
    if(!step.b) return 1200;
    let g=(900+step.b.length*132)/speedFactor();
    if(S.silent||!canSpeak()) g+=step.a.length*118;   // 무음이면 앞 절 몫도 사용자가 읽는다
    return g;
  }
  function savePos(){ store.save(S.intent,{k:S.key,i:S.i,at:Date.now()}); }
  async function run(){
    const gen=++S.gen; const step=S.q[S.i]; if(!step) return;
    S.phase="reading"; emit();
    if(step.t==="decl"&&S.i>0) buzz("decade");
    if(S.silent) await new Promise(r=>setTimeout(r, Math.min(step.a.length*60,1800))); else await speak(step.a);
    if(gen!==S.gen) return;
    if(step.b){ S.phase="mine"; emit(); }
    S.timer=setTimeout(()=>{ if(gen!==S.gen) return; advance(); }, gapMs(step));
  }
  function advance(){
    S.i++; if(S.q[S.i]&&S.q[S.i].t==="hail") buzz("bead");
    if(S.i>=TOTAL){ finish(); return; }
    savePos(); run();
  }
  function finish(){
    clear(); S.elapsed+=S.t0?Date.now()-S.t0:0; S.t0=0; S.phase="done"; store.clear(S.intent); store.bump(); buzz("done"); emit(); opts.onDone&&opts.onDone(snapshot());
  }
  const api={
    snapshot, build:()=>build(S.key),
    home(){ clear(); S.phase="idle"; S.t0=0; emit(); },
    start({intent,fromSaved}={}){
      if(intent) S.intent=intent;
      const pos=fromSaved?store.pos(S.intent):null;
      if(pos){ S.key=pos.k; S.i=pos.i; S.resumes++; } else { S.key=today(); S.i=0; S.resumes=0; store.clear(S.intent); }
      S.q=build(S.key); S.t0=Date.now(); S.elapsed=0; savePos(); run();
    },
    pause(){ if(S.phase==="reading"||S.phase==="mine"){ clear(); S.elapsed+=Date.now()-S.t0; S.t0=0; savePos(); S.phase="paused"; emit(); } },
    resume(){ if(S.phase==="paused"){ S.t0=Date.now(); S.resumes++; run(); } },
    end(){ clear(); store.clear(S.intent); S.phase="idle"; S.t0=0; emit(); },
    next(){ if(S.phase==="reading"||S.phase==="mine"){ clear(); advance(); } },   // 손으로 넘기기 (장르 6)
    remainingMin(){ const left=TOTAL-S.i; return Math.max(1,Math.round(left*9.5/60)); },
    toggleSilent(){ S.silent=!S.silent; store.setSet({...store.set(),silent:S.silent}); if(S.silent) buzz("silentOn"); emit(); },
    setSpeed(v){ S.speed=v; store.setSet({...store.set(),speed:v}); emit(); },
    setIntent(name){ S.intent=name; emit(); },
    addIntent(name){ name=(name||"").trim().slice(0,24); if(!name) return; const a=store.intents(); if(!a.includes(name)){ a.push(name); store.setIntents(a); } S.intent=name; emit(); },
    removeIntent(name){ const a=store.intents(); if(a.length<=1) return; store.setIntents(a.filter(x=>x!==name)); store.clear(name); if(S.intent===name) S.intent=store.intents()[0]; emit(); },
    /* 스크린샷·시연용 — ?demo=open|pray|mine|resume|paused|done */
    demo(mode){
      clear();
      if(mode==="resume"||mode==="paused"){ S.key="sorrow"; S.q=build(S.key); S.i=7+14*2+2+3; store.save(S.intent,{k:S.key,i:S.i,at:Date.now()-26*3600e3}); }
      if(mode==="pray"||mode==="mine"){ S.key=today(); S.q=build(S.key); S.i=7+14*1+2+3; S.phase=mode==="pray"?"reading":"mine"; S.t0=Date.now()-6*60000; }
      else if(mode==="paused"){ S.phase="paused"; S.elapsed=6*60000; }
      else if(mode==="done"){ S.key=today(); S.q=build(S.key); S.i=TOTAL; S.phase="done"; S.elapsed=21*60000; S.resumes=1; }
      else { S.phase="idle"; }
      emit();
    },
    demoFromURL(){ const m=new URLSearchParams(location.search).get("demo"); if(m) api.demo(m); else emit(); return !!m; },
  };
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) api.pause(); });
  return api;
}
window.Rosary={create,build,MYST,DAYS,DAYNM,P,TOTAL,today,ago,where,store};
})();
</script>
<script>
let tab="home"; const R=Rosary.create({onChange:render}); let S=R.snapshot();
const $=s=>document.querySelector(s);
const TABS=[["home","홈","M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],["pray","기도","M12 3v18M6 9h12"],["log","기록","M4 19h16M6 15V9M12 15V5M18 15v-3"],["set","설정","M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 4l2-1-1-3-2 .3a8 8 0 0 0-1.4-1.4L18 4l-3-1-1 2a8 8 0 0 0-2 0L11 3 8 4l.4 2.9A8 8 0 0 0 7 8.3L4 8l-1 3 2 1a8 8 0 0 0 0 2l-2 1 1 3 3-.3a8 8 0 0 0 1.4 1.4L8 20l3 1 1-2a8 8 0 0 0 2 0l1 2 3-1-.4-2.9A8 8 0 0 0 19 15.7l3 .3 1-3-2-1a8 8 0 0 0 0-2z"]];
function render(s){ S=s;
  if(s.phase!=="idle"&&s.phase!=="done") tab="pray"; if(s.phase==="done") tab="pray";
  $("#tabs").innerHTML=TABS.map(([k,n,d])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}"><svg viewBox="0 0 24 24"><path d="${d}"/></svg>${n}</button>`).join("");
  const m=$("#main");
  if(tab==="home"){ m.innerHTML=`<div class="sub">${s.todayName}</div><h1>오늘의 기도</h1><div class="sub">${s.intent}을 위하여</div>
    ${s.pos?`<div class="card resume"><div class="k">이어서 바치기</div><div class="w">${Rosary.MYST[s.pos.k][0]} · ${s.posWhere}</div><div class="sub" style="margin:0 0 10px">${s.posAgo}에 멈췄습니다</div><button class="btn a" data-act="resume">이어서 바치기</button></div>`:""}
    <div class="card hero"><div class="k">오늘의 신비</div><h2>${s.mystName}</h2><div style="font-size:13px;opacity:.9;margin-bottom:14px">5단 · 약 ${R.remainingMin()}분 · 앱이 앞 절을 읽고 당신이 뒷 절을 받습니다</div><button class="btn p" data-act="start">▶ ${s.pos?"처음부터 다시":"시작"}</button></div>
    <div class="card list">${Object.entries(Rosary.MYST).map(([k,[n]])=>`<div class="row ${k===s.key?'today':''}"><div class="ico">${n[0]}</div><div class="t"><b>${n}</b><span>${k===s.key?"오늘":"요일에 맞춰 자동으로 바뀝니다"}</span></div></div>`).join("")}</div>
    <div class="card list"><div class="row"><div class="t"><b>지향</b><span>${s.intents.join(" · ")}</span></div><button class="btn g" style="width:auto" data-act="addIntent">+ 추가</button></div></div>`; }
  else if(tab==="pray"){
    if(s.phase==="idle"){ m.innerHTML=`<h1>기도</h1><div class="sub">시작하면 이 화면이 플레이어가 됩니다</div><div class="card"><button class="btn a" data-act="start">▶ ${s.mystName} 시작</button></div>`; return; }
    if(s.phase==="done"){ m.innerHTML=`<div class="done"><div class="ck">✓</div><h1>다 바쳤습니다</h1><div class="sub">${s.mystName} · ${s.intent}을 위하여</div><div class="card stat"><div><b>50</b><span>성모송</span></div><div><b>${s.elapsedMin}</b><span>걸린 분</span></div><div><b>${s.resumes}</b><span>이어서</span></div></div><button class="btn g" data-act="home">홈으로</button></div>`; return; }
    const st=s.step, mine=s.phase==="mine";
    m.innerHTML=`<div class="player"><div class="art"><div><b>${st.dec?`제${st.dec}단`:"시작 기도"}</b>${st.mystery||s.mystName}</div></div>
      <div class="prog"><i style="width:${s.progress*100}%"></i></div><div class="meta"><span>${st.label}</span><span>${s.i+1} / 77 · 약 ${R.remainingMin()}분 남음</span></div>
      <span class="turn ${mine?'':'read'}">${s.phase==="paused"?"멈춤":mine?"● 내 차례":"앱이 읽는 중"}</span>
      <div class="text ${mine?'mine':''}"><div class="a">${st.a}</div>${st.b?`<div class="b">${st.b}</div>`:""}</div>
      <div class="ctrl"><button class="sm" data-act="end">끝내기</button><button class="big" data-act="${s.phase==="paused"?"continue":"pause"}">${s.phase==="paused"?'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'}</button><button class="sm" data-act="silent">${s.silent?"🔕 침묵":"🔈 소리"}</button></div></div>
      ${s.phase==="paused"?`<div class="overlay"><div class="card"><h1>멈춰 있습니다</h1><div class="sub">${st.label} · 자리는 남아 있습니다</div><button class="btn a" data-act="continue" style="margin-bottom:8px">이어서 바치기</button><button class="btn g" data-act="home">홈으로</button></div></div>`:""}`;
  }
  else if(tab==="log"){ m.innerHTML=`<h1>기록</h1><div class="sub">순위도 연속 기록도 없습니다. 바친 횟수만 조용히 셉니다</div><div class="card stat"><div><b>${s.count}</b><span>바친 횟수</span></div><div><b>${s.intents.length}</b><span>지향</span></div><div><b>${s.pos?1:0}</b><span>이어갈 자리</span></div></div>`; }
  else { m.innerHTML=`<h1>설정</h1><div class="card list set"><div class="row"><div class="t"><b>침묵 진행</b><span>소리 없이 진동만</span></div><button class="tog ${s.silent?'on':''}" data-act="silent"><i></i></button></div><div class="row"><div class="t"><b>받는 사이</b><span>뒷 절을 바칠 시간</span></div><div class="seg">${[[0.75,"느리게"],[1,"보통"],[1.35,"빠르게"]].map(([v,n])=>`<button class="${s.speed===v?'on':''}" data-act="speed" data-v="${v}">${n}</button>`).join("")}</div></div><div class="row"><div class="t"><b>한국어 음성</b><span>${s.voice?"이 기기에서 사용 가능":"없음 — 소리 없이 진행됩니다"}</span></div></div></div>`; }
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  if(a==="tab"){ tab=v; render(S); } else if(a==="start") R.start(); else if(a==="resume") R.start({fromSaved:true}); else if(a==="pause") R.pause(); else if(a==="continue") R.resume();
  else if(a==="end") R.end(); else if(a==="home"){ tab="home"; R.home(); } else if(a==="silent") R.toggleSilent(); else if(a==="speed") R.setSpeed(+v); else if(a==="addIntent"){ const n=prompt("지향 이름 (24자)"); if(n) R.addIntent(n); } });
R.demoFromURL();
</script></body></html>
