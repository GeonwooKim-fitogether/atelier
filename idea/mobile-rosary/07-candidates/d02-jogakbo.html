<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방향 2 — 조각보</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--mosi:#F4F1E8;--jjok:#3E5C76;--chija:#E3B23C;--somok:#A8465B;--ssuk:#7A8B6F;--ink:#2B2723;--faint:#9A958B}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--mosi);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hm{font-family:"Hahmlet","Noto Serif KR",serif}
.cloth{padding:16px 16px 0;display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.row{display:flex;gap:3px}
.cell{height:26px;background:#EAE6DA;transition:background .45s}
.cell.on{background:var(--c)}
.cell.cur{outline:2px solid var(--ink);outline-offset:-2px;background:var(--c);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.cell.cur{animation:none}}
main{flex:1;padding:20px 22px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.eye{font-size:11px;letter-spacing:.2em;color:var(--faint)}
h1{font-family:"Hahmlet",serif;font-weight:600;font-size:30px;line-height:1.25;margin-top:6px}
.who{font-size:13px;color:var(--faint);margin-top:5px}
.sp{flex:1}
.pr .m{font-size:12px;letter-spacing:.1em;color:var(--jjok);margin-bottom:12px}
.pr .a{font-family:"Hahmlet",serif;font-size:20px;line-height:1.72;font-weight:400}
.pr .b{font-family:"Hahmlet",serif;font-size:20px;line-height:1.72;color:var(--faint);margin-top:10px}
.pr.mine .a{color:var(--faint)}.pr.mine .b{color:var(--somok);font-weight:600}
.turn{margin-top:16px;font-size:11px;letter-spacing:.22em;color:var(--faint)}.turn.mine{color:var(--somok)}
button{font:500 15px/1 "Noto Sans KR",sans-serif;cursor:pointer;border:0;background:none;text-align:left;color:var(--ink)}
.b1{font-family:"Hahmlet",serif;font-size:19px;font-weight:600;border-bottom:2px solid var(--jjok);padding:0 0 8px;color:var(--jjok)}
.b2{font-size:13px;color:var(--faint);padding:4px 0}
.acts{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:18px}
.res{font-size:12px;color:var(--faint)}
.opts{display:flex;gap:18px;margin-top:20px;font-size:12px}.opts button{font-size:12px;color:var(--faint)}
.n{display:flex;gap:24px;margin:20px 0}.n b{display:block;font-family:"Hahmlet",serif;font-weight:400;font-size:26px}.n span{font-size:11px;color:var(--faint)}
.veil{position:fixed;inset:0;background:rgba(244,241,232,.96);max-width:430px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:26px 22px}
</style></head><body>
<div class="cloth" id="cloth"></div><main id="ui"></main>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot();
const CO=["var(--jjok)","var(--chija)","var(--somok)","var(--ssuk)","var(--jjok)","var(--chija)","var(--ssuk)"];
const FL=[[3,2,4,2,3,2,5],[2,4,2,3,5,2,3],[4,2,3,2,2,5,3],[2,3,5,2,3,2,4],[3,5,2,4,2,3,2],[5,2,3,2,4,3,2],[2,3,2,5,3,4,2],[3,2,4,3,2,2,5],[4,3,2,2,5,3,2],[2,5,3,4,2,2,3],[3,2,2,4,3,5,2]];
function cloth(s){ const done=s.phase==="done"; const cur=done?77:(s.phase==="idle"?-1:s.i);
  return FL.map((row,r)=>'<div class="row">'+row.map((f,c)=>{const i=r*7+c, on=done||i<cur, is=i===cur;
    return '<div class="cell '+(is?"cur":on?"on":"")+'" style="flex:'+f+';--c:'+CO[(r+c)%7]+'"></div>';}).join("")+'</div>').join(""); }
function render(s){ S=s; document.getElementById("cloth").innerHTML=cloth(s); const u=document.getElementById("ui");
  if(s.phase==="idle"){ u.innerHTML='<div class="eye">'+s.todayName+'</div><h1>'+s.mystName+'</h1><div class="who">'+s.intent+'을 위하여 · 77조각</div><div class="sp"></div>'
    +'<div class="acts">'+(s.pos?'<div class="res">'+Rosary.MYST[s.pos.k][0]+' · '+s.posWhere+' · '+s.posAgo+'</div><button class="b1" data-a="resume">이어서 바치기</button><button class="b2" data-a="start">처음부터 다시</button>':'<button class="b1" data-a="start">첫 조각을 놓습니다</button>')
    +'</div><div class="opts"><button data-a="silent">'+(s.silent?"침묵 진행":"소리로 진행")+'</button><button data-a="speed">받는 사이 '+({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]+'</button></div>'; return; }
  if(s.phase==="done"){ u.innerHTML='<div class="eye">보자기 한 장</div><h1>다 바쳤습니다</h1><div class="who">'+s.mystName+' · '+s.intent+'을 위하여</div><div class="n"><div><b>50</b><span>성모송</span></div><div><b>'+s.elapsedMin+'</b><span>걸린 분</span></div><div><b>'+s.resumes+'</b><span>이어서</span></div></div><div class="sp"></div><button class="b2" data-a="home">돌아가기</button>'; return; }
  const st=s.step, mine=s.phase==="mine";
  u.innerHTML='<div class="eye">'+st.label+' · '+(s.i+1)+' / 77</div><div class="sp"></div><div class="pr '+(mine?"mine":"")+'"><div class="m">'+(st.mystery||s.mystName)+'</div><div class="a">'+st.a+'</div>'+(st.b?'<div class="b">'+st.b+'</div>':'')+'<div class="turn '+(mine?"mine":"")+'">'+(mine?"내 차례":"앱이 읽고 있습니다")+'</div></div><div class="opts"><button data-a="pause">잠시 멈춤</button><button data-a="end">여기서 끝내기</button></div>'
    +(s.phase==="paused"?'<div class="veil"><div class="eye">멈춰 있습니다</div><h1 style="font-size:26px">'+st.label+'</h1><div class="who">조각은 그대로 남아 있습니다</div><div class="acts"><button class="b1" data-a="continue">이어서 바치기</button><button class="b2" data-a="home">홈으로</button></div></div>':'');
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?.75:1)})[b.dataset.a]?.();});
R.demoFromURL();
</script></body></html>
