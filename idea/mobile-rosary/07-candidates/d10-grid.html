<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>방향 10 — 격자</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@300;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
:root{--paper:#F7F5F0;--ink:#111214;--indigo:#2B3A8F;--verm:#E4572E;--grey:#8B8B86;--rule:#D9D6CE}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
.bg{font-family:"Bricolage Grotesque","Arial",sans-serif}
.mono{font-family:"JetBrains Mono","SFMono-Regular",monospace}
.top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:22px 20px 12px;border-bottom:1px solid var(--ink)}
.k{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:33px;line-height:1.05;letter-spacing:-.025em;margin-top:6px}
main{flex:1;padding:0 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.numwrap{position:relative;height:150px;overflow:hidden;border-bottom:1px solid var(--rule)}
.num{position:absolute;left:-10px;top:-26px;font-family:"JetBrains Mono",monospace;font-weight:300;font-size:172px;line-height:1;letter-spacing:-.06em;color:var(--ink);white-space:nowrap}
.num em{font-style:normal;color:var(--verm)}
.of{position:absolute;right:0;bottom:12px;text-align:right}
.of .b{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--grey)}
.rows{border-bottom:1px solid var(--rule)}
.r{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.r:first-child{border-top:0}
.r .lab{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);padding-top:3px}
.r .val{font-size:15px}
.pr{padding:18px 0}
.pr .a{font-size:19px;line-height:1.66}
.pr .b{font-size:19px;line-height:1.66;color:var(--grey);margin-top:9px}
.pr.mine .a{color:var(--grey)}.pr.mine .b{color:var(--indigo);font-weight:500}
.turn{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);border:1px solid var(--rule);padding:5px 9px;margin-top:14px}
.turn.mine{color:var(--verm);border-color:var(--verm)}
.sp{flex:1}
button{font:500 15px/1 "Noto Sans KR";border:0;background:none;cursor:pointer;color:var(--ink);text-align:left}
.b1{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:18px;background:var(--ink);color:var(--paper);padding:16px 22px;min-height:54px;align-self:flex-start}
.b2{font-size:13px;color:var(--grey);margin-top:10px;align-self:flex-start}
.res{border-left:3px solid var(--verm);padding:10px 0 10px 12px;margin-bottom:16px}
.res .w{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:17px}
.res .t{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--grey);margin-top:3px}
.opts{display:flex;gap:16px;margin-top:18px;border-top:1px solid var(--rule);padding-top:14px}
.opts button{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.n{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:16px 0}
.n div{padding:12px 0}.n b{display:block;font-family:"JetBrains Mono",monospace;font-weight:300;font-size:30px;letter-spacing:-.03em}
.n span{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.veil{position:fixed;inset:0;background:var(--paper);max-width:430px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:26px 20px}
</style></head><body>
<div id="app" style="display:contents"></div>
<script src="engine.js"></script>
<script>
const R=Rosary.create({onChange:render}); let S=R.snapshot(); const app=document.getElementById("app");
function render(s){ S=s;
  if(s.phase==="idle"){ app.innerHTML='<div class="top"><div><div class="k">'+s.todayName+' · 오늘의 신비</div><h1>'+s.mystName+'</h1></div><div class="k">77</div></div>'
    +'<main><div class="rows"><div class="r"><div class="lab">지향</div><div class="val">'+s.intent+'</div></div><div class="r"><div class="lab">구성</div><div class="val">시작 기도 7 + 각 단 14 × 5단</div></div><div class="r"><div class="lab">진행</div><div class="val">앞 절은 앱이, 뒷 절은 당신이</div></div></div><div class="sp"></div>'
    +(s.pos?'<div class="res"><div class="w">'+Rosary.MYST[s.pos.k][0]+' · '+s.posWhere+'</div><div class="t">'+s.posAgo+'에 멈췄습니다</div></div><button class="b1" data-a="resume">이어서 바치기</button><button class="b2" data-a="start">처음부터 다시</button>':'<button class="b1" data-a="start">시작</button>')
    +'<div class="opts"><button data-a="silent">'+(s.silent?"침묵 진행":"소리 진행")+'</button><button data-a="speed">사이 '+({0.75:"느리게",1:"보통",1.35:"빠르게"})[s.speed]+'</button><button data-a="addIntent">지향 +</button></div></main>'; return; }
  if(s.phase==="done"){ app.innerHTML='<div class="top"><div><div class="k">'+s.mystName+'</div><h1>다 바쳤습니다</h1></div><div class="k">77 / 77</div></div><main><div class="n"><div><b>50</b><span>성모송</span></div><div><b>'+s.elapsedMin+'</b><span>걸린 분</span></div><div><b>'+s.resumes+'</b><span>이어서</span></div></div><div class="val">'+s.intent+'을 위하여</div><div class="sp"></div><button class="b2" data-a="home">돌아가기</button></main>'; return; }
  const st=s.step, mine=s.phase==="mine", n=String(s.i+1).padStart(2,"0");
  app.innerHTML='<div class="top"><div><div class="k">'+st.label+'</div><h1 style="font-size:22px;line-height:1.2">'+(st.mystery||s.mystName)+'</h1></div><div class="k">'+(mine?"내 차례":"읽는 중")+'</div></div>'
    +'<main><div class="numwrap"><div class="num">'+n+'<em>/77</em></div><div class="of"><div class="b">'+(st.of?(st.bead+1)+" / "+st.of:"—")+'</div></div></div>'
    +'<div class="pr '+(mine?"mine":"")+'"><div class="a">'+st.a+'</div>'+(st.b?'<div class="b">'+st.b+'</div>':'')+'<div class="turn '+(mine?"mine":"")+'">'+(mine?"your line":"app reading")+'</div></div><div class="sp"></div>'
    +'<div class="opts"><button data-a="pause">잠시 멈춤</button><button data-a="end">여기서 끝내기</button></div></main>'
    +(s.phase==="paused"?'<div class="veil"><div class="k">멈춰 있습니다</div><h1 style="font-size:28px;margin-top:8px">'+st.label+'</h1><div class="res" style="margin-top:16px"><div class="w">자리는 남아 있습니다</div><div class="t">'+(st.mystery||s.mystName)+'</div></div><button class="b1" data-a="continue">이어서 바치기</button><button class="b2" data-a="home">홈으로</button></div>':'');
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;({start:()=>R.start(),resume:()=>R.start({fromSaved:true}),pause:()=>R.pause(),continue:()=>R.resume(),end:()=>R.end(),home:()=>R.home(),silent:()=>R.toggleSilent(),speed:()=>R.setSpeed(S.speed===1?1.35:S.speed===1.35?.75:1),addIntent:()=>{const n=prompt("지향 이름 (24자)");if(n)R.addIntent(n);}})[b.dataset.a]?.();});
R.demoFromURL();
</script></body></html>
